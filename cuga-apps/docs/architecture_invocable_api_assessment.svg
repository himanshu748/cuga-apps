<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1600 1140"><defs><filter id="shadow" width="104%" height="108%" x="-2%" y="-2%"><feDropShadow dx="0" dy="2" flood-opacity=".08" stdDeviation="3"/></filter></defs><rect width="1600" height="1140" fill="#fafbfc"/><text x="800" y="42" fill="#0f172a" font-size="28" font-weight="700" text-anchor="middle">Bird Invocable API · is this a strong agent demo?</text><text x="800" y="70" fill="#64748b" font-size="14" text-anchor="middle">Yes — for these 5 reasons. With one honest caveat the deck shouldn&apos;t paper over.</text><g transform="translate(40, 96)"><rect width="1520" height="32" fill="#10b981" rx="6"/><text x="14" y="22" fill="#fff" font-size="13" font-weight="700">A. AGENT CAPABILITIES THAT ARE ACTUALLY EXERCISED · things a one-shot LLM cannot replicate</text></g><g filter="url(#shadow)" transform="translate(40, 142)"><rect width="290" height="248" fill="#fff" stroke="#10b981" stroke-width="1.5" rx="12"/><rect width="290" height="42" fill="#10b981" rx="12"/><rect width="290" height="12" y="30" fill="#10b981"/><circle cx="26" cy="22" r="14" fill="#fff"/><text x="26" y="27" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="48" y="27" fill="#fff" font-size="13" font-weight="700">Stateful multi-turn</text><text x="48" y="40" fill="#d1fae5" font-size="11">+ feedback loop</text><text x="16" y="68" fill="#475569" font-size="11" font-style="italic">Next action depends on what the last step revealed — no fixed plan.</text><line x1="16" x2="274" y1="92" y2="92" stroke="#e2e8f0"/><text x="16" y="112" fill="#065f46" font-size="10.5" font-weight="700">EVIDENCE · qid 28</text><text x="16" y="132" fill="#475569" font-size="11">Step 5 db_sample_rows(schools)</text><text x="16" y="148" fill="#475569" font-size="11">→ FundingType is free-text</text><text x="16" y="174" fill="#065f46" font-size="11" font-weight="700">→ triggers Step 6</text><text x="16" y="190" fill="#475569" font-family="monospace" font-size="11">db_run_sql DISTINCT</text><text x="16" y="220" fill="#475569" font-size="11" font-style="italic">A scripted pipeline would batch-prefetch every value upfront.</text></g><g filter="url(#shadow)" transform="translate(347.5, 142)"><rect width="290" height="248" fill="#fff" stroke="#10b981" stroke-width="1.5" rx="12"/><rect width="290" height="42" fill="#10b981" rx="12"/><rect width="290" height="12" y="30" fill="#10b981"/><circle cx="26" cy="22" r="14" fill="#fff"/><text x="26" y="27" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="48" y="27" fill="#fff" font-size="13" font-weight="700">18-tool selection</text><text x="48" y="40" fill="#d1fae5" font-size="11">over 5 families</text><text x="16" y="68" fill="#475569" font-size="11" font-style="italic">The right family at the right time depends on agent state — not policy.</text><line x1="16" x2="274" y1="92" y2="92" stroke="#e2e8f0"/><text x="16" y="112" fill="#065f46" font-size="10.5" font-weight="700">FAMILIES</text><g transform="translate(16, 122)"><rect width="120" height="22" fill="#ecfeff" stroke="#0ea5e9" rx="11"/><text x="60" y="16" fill="#0c4a6e" font-size="10.5" font-weight="600" text-anchor="middle">db_* / bird_* read</text></g><g transform="translate(146, 122)"><rect width="124" height="22" fill="#f5f3ff" stroke="#8b5cf6" rx="11"/><text x="62" y="16" fill="#3b0764" font-size="10.5" font-weight="600" text-anchor="middle">tool_register mutate</text></g><g transform="translate(16, 150)"><rect width="120" height="22" fill="#ecfdf5" stroke="#10b981" rx="11"/><text x="60" y="16" fill="#065f46" font-size="10.5" font-weight="600" text-anchor="middle">tool_call exec</text></g><g transform="translate(146, 150)"><rect width="124" height="22" fill="#fef3c7" stroke="#f59e0b" rx="11"/><text x="62" y="16" fill="#78350f" font-size="10.5" font-weight="600" text-anchor="middle">seq_* validate</text></g><text x="16" y="200" fill="#065f46" font-size="11" font-weight="700">qid 28 used 4 of 5 families</text><text x="16" y="220" fill="#475569" font-size="11" font-style="italic">in 13 calls — a scripted state machine would freeze the order.</text></g><g filter="url(#shadow)" transform="translate(655, 142)"><rect width="290" height="248" fill="#fff" stroke="#10b981" stroke-width="1.5" rx="12"/><rect width="290" height="42" fill="#10b981" rx="12"/><rect width="290" height="12" y="30" fill="#10b981"/><circle cx="26" cy="22" r="14" fill="#fff"/><text x="26" y="27" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="48" y="27" fill="#fff" font-size="13" font-weight="700">Course correction</text><text x="48" y="40" fill="#d1fae5" font-size="11">from oracle diffs</text><text x="16" y="68" fill="#475569" font-size="11" font-style="italic">Failure is a signal, not a wall. Up to 2 retries per question.</text><line x1="16" x2="274" y1="92" y2="92" stroke="#e2e8f0"/><text x="16" y="112" fill="#065f46" font-size="10.5" font-weight="700">LOOP</text><text x="16" y="132" fill="#475569" font-family="monospace" font-size="11">seq_validate → passed=false</text><text x="16" y="148" fill="#475569" font-family="monospace" font-size="11">→ failure_msg points</text><text x="16" y="164" fill="#475569" font-family="monospace" font-size="11">at offending step</text><text x="16" y="184" fill="#065f46" font-size="11" font-weight="700">→ tool_register (fix)</text><text x="16" y="202" fill="#065f46" font-size="11" font-weight="700">→ seq_validate (retry)</text><text x="16" y="226" fill="#475569" font-size="11" font-style="italic">Forbidden-name + near-duplicate guards reject shortcuts.</text></g><g filter="url(#shadow)" transform="translate(962.5, 142)"><rect width="290" height="248" fill="#fff" stroke="#10b981" stroke-width="1.5" rx="12"/><rect width="290" height="42" fill="#10b981" rx="12"/><rect width="290" height="12" y="30" fill="#10b981"/><circle cx="26" cy="22" r="14" fill="#fff"/><text x="26" y="27" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="48" y="27" fill="#fff" font-size="13" font-weight="700">Oracle-grounded</text><text x="48" y="40" fill="#d1fae5" font-size="11">synthesis</text><text x="16" y="68" fill="#475569" font-size="11" font-style="italic">The agent has a measurable target before it writes a line of code.</text><line x1="16" x2="274" y1="92" y2="92" stroke="#e2e8f0"/><text x="16" y="112" fill="#065f46" font-size="10.5" font-weight="700">PRE-CODE</text><text x="16" y="132" fill="#475569" font-family="monospace" font-size="11">bird_run_gold(qid)</text><text x="16" y="148" fill="#475569" font-size="11">→ canonical 57 rows</text><text x="16" y="174" fill="#065f46" font-size="10.5" font-weight="700">CONTRAST</text><text x="16" y="192" fill="#475569" font-size="11">A one-shot wrapper has no</text><text x="16" y="208" fill="#475569" font-size="11">oracle until eval time.</text><text x="16" y="224" fill="#065f46" font-size="11" font-weight="700">&quot;trustworthy by construction&quot;</text></g><g filter="url(#shadow)" transform="translate(1270, 142)"><rect width="290" height="248" fill="#fff" stroke="#10b981" stroke-width="1.5" rx="12"/><rect width="290" height="42" fill="#10b981" rx="12"/><rect width="290" height="12" y="30" fill="#10b981"/><circle cx="26" cy="22" r="14" fill="#fff"/><text x="26" y="27" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="48" y="27" fill="#fff" font-size="13" font-weight="700">Cross-question state</text><text x="48" y="40" fill="#d1fae5" font-size="11">accumulates</text><text x="16" y="68" fill="#475569" font-size="11" font-style="italic">Agent reasons across episodes, not just within one.</text><line x1="16" x2="274" y1="92" y2="92" stroke="#e2e8f0"/><text x="16" y="112" fill="#065f46" font-size="10.5" font-weight="700">RULE</text><text x="16" y="132" fill="#475569" font-family="monospace" font-size="11">tool_list before designing</text><text x="16" y="148" fill="#475569" font-size="11">→ if a tool fits, REUSE it</text><text x="16" y="164" fill="#475569" font-size="11">with different args.</text><text x="16" y="190" fill="#065f46" font-size="11" font-weight="700">Most agent demos don&apos;t</text><text x="16" y="206" fill="#065f46" font-size="11" font-weight="700">ask this — within-episode</text><text x="16" y="222" fill="#065f46" font-size="11" font-weight="700">tool-calls only.</text></g><g filter="url(#shadow)" transform="translate(40, 410)"><rect width="1520" height="48" fill="#312e81" rx="10"/><text x="20" y="20" fill="#fde68a" font-size="13" font-weight="700">★ Bonus · recursive</text><text x="200" y="20" fill="#e0e7ff" font-size="13">The agent&apos;s <tspan fill="#fff" font-family="monospace">output</tspan> is itself a runnable MCP server.</text><text x="20" y="38" fill="#c7d2fe" font-size="12">An agent producing tools that other agents can be benchmarked against. Few demos in the repo cross that meta-line.</text></g><g transform="translate(40, 478)"><rect width="1520" height="32" fill="#f59e0b" rx="6"/><text x="14" y="22" fill="#fff" font-size="13" font-weight="700">B. BUT THE HONEST NUMBERS · output/california_schools/validation_report.json · measured, not aspirational</text></g><g filter="url(#shadow)" transform="translate(40, 524)"><rect width="368" height="180" fill="#fff" stroke="#cbd5e1" rx="12"/><text x="20" y="28" fill="#475569" font-size="12" font-weight="700" letter-spacing=".06em">PASS RATE</text><text x="20" y="68" fill="#10b981" font-size="36" font-weight="800">75%</text><text x="170" y="68" fill="#64748b" font-size="14">67 / 89 questions</text><text x="170" y="86" fill="#94a3b8" font-size="11" font-style="italic">passed seq_validate</text><rect width="328" height="16" x="20" y="108" fill="#f1f5f9" rx="8"/><rect width="246" height="16" x="20" y="108" fill="#10b981" rx="8"/><line x1="316" x2="316" y1="102" y2="130" stroke="#dc2626" stroke-dasharray="3 2" stroke-width="2"/><text x="316" y="142" fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle">90% target</text><text x="20" y="166" fill="#475569" font-size="11"><tspan fill="#10b981" font-weight="700">solid</tspan> for unsupervised first pass; the 25% tail is where retry/fallback failed</text></g><g filter="url(#shadow)" transform="translate(424, 524)"><rect width="368" height="180" fill="#fff" stroke="#cbd5e1" rx="12"/><text x="20" y="28" fill="#475569" font-size="12" font-weight="700" letter-spacing=".06em">MEAN REUSE PER TOOL</text><text x="20" y="68" fill="#dc2626" font-size="36" font-weight="800">1.0×</text><text x="170" y="68" fill="#64748b" font-size="14">68 distinct tools</text><text x="170" y="86" fill="#94a3b8" font-size="11" font-style="italic">in passing sequences</text><rect width="328" height="16" x="20" y="108" fill="#f1f5f9" rx="8"/><rect width="55" height="16" x="20" y="108" fill="#dc2626" rx="8"/><line x1="219" x2="219" y1="102" y2="130" stroke="#10b981" stroke-dasharray="3 2" stroke-width="2"/><text x="219" y="142" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">3× target</text><text x="20" y="166" fill="#475569" font-size="11"><tspan fill="#dc2626" font-weight="700">moat is theoretical here</tspan> · agent defaulted to one-tool-per-question</text></g><g filter="url(#shadow)" transform="translate(808, 524)"><rect width="368" height="180" fill="#fff" stroke="#cbd5e1" rx="12"/><text x="20" y="28" fill="#475569" font-size="12" font-weight="700" letter-spacing=".06em">MULTI-STEP DECOMPOSITION</text><text x="20" y="68" fill="#dc2626" font-size="36" font-weight="800">1%</text><text x="170" y="68" fill="#64748b" font-size="14">1 of 67 passing</text><text x="170" y="86" fill="#94a3b8" font-size="11" font-style="italic">qid 28 was the lone one</text><rect width="328" height="16" x="20" y="108" fill="#f1f5f9" rx="8"/><rect width="3" height="16" x="20" y="108" fill="#dc2626" rx="2"/><line x1="118" x2="118" y1="102" y2="130" stroke="#10b981" stroke-dasharray="3 2" stroke-width="2"/><text x="118" y="142" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">~30% target</text><text x="20" y="166" fill="#475569" font-size="11">prompt teaches signals (subqueries, CTEs); LLM picks easier path 99% of time</text></g><g filter="url(#shadow)" transform="translate(1192, 524)"><rect width="368" height="180" fill="#fff" stroke="#cbd5e1" rx="12"/><text x="20" y="28" fill="#475569" font-size="12" font-weight="700" letter-spacing=".06em">API SURFACE SIZE</text><text x="20" y="68" fill="#dc2626" font-size="36" font-weight="800">101</text><text x="170" y="68" fill="#64748b" font-size="14">tools registered</text><text x="170" y="86" fill="#94a3b8" font-size="11" font-style="italic">for 89 questions → &gt;1:1</text><rect width="328" height="16" x="20" y="108" fill="#f1f5f9" rx="8"/><rect width="328" height="16" x="20" y="108" fill="#dc2626" rx="8"/><line x1="91" x2="91" y1="102" y2="130" stroke="#10b981" stroke-dasharray="3 2" stroke-width="2"/><text x="91" y="142" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">~25 target</text><text x="20" y="166" fill="#475569" font-size="11">includes re-registrations from retries · net direction: wrong</text></g><g transform="translate(40, 724)"><rect width="1520" height="32" fill="#312e81" rx="6"/><text x="14" y="22" fill="#fff" font-size="13" font-weight="700">C. HOW TO FRAME THIS IN THE DECK · honesty &gt; theatre · the gap itself is the research finding</text></g><g filter="url(#shadow)" transform="translate(40, 770)"><rect width="752" height="290" fill="#fff" stroke="#fecaca" stroke-width="1.5" rx="14"/><rect width="752" height="42" fill="#dc2626" rx="14"/><rect width="752" height="12" y="30" fill="#dc2626"/><text x="20" y="28" fill="#fff" font-size="14" font-weight="700">DON&apos;T claim</text><g transform="translate(20, 60)"><rect width="712" height="46" fill="#fef2f2" rx="8"/><text x="14" y="20" fill="#475569" font-size="12" font-style="italic">&quot;The agent compositionally reuses tools across questions.&quot;</text><text x="14" y="36" fill="#991b1b" font-size="11" font-weight="600">→ The numbers say 1.0× mean reuse. It&apos;s not happening here.</text></g><g transform="translate(20, 116)"><rect width="712" height="46" fill="#fef2f2" rx="8"/><text x="14" y="20" fill="#475569" font-size="12" font-style="italic">&quot;We synthesized a small reusable API surface.&quot;</text><text x="14" y="36" fill="#991b1b" font-size="11" font-weight="600">→ 101 tools for 89 questions is bigger than 1:1, not smaller.</text></g><g transform="translate(20, 172)"><rect width="712" height="46" fill="#fef2f2" rx="8"/><text x="14" y="20" fill="#475569" font-size="12" font-style="italic">&quot;Agent decomposes hard questions into multi-step sequences.&quot;</text><text x="14" y="36" fill="#991b1b" font-size="11" font-weight="600">→ 1 of 67 passing. The architecture supports it; the LLM declines.</text></g><g transform="translate(20, 228)"><rect width="712" height="46" fill="#fef2f2" rx="8"/><text x="14" y="20" fill="#475569" font-size="12" font-style="italic">&quot;Production-ready benchmark dataset.&quot;</text><text x="14" y="36" fill="#991b1b" font-size="11" font-weight="600">→ 25% failure tail; over-fit-to-question tools. Research artifact.</text></g></g><g filter="url(#shadow)" transform="translate(808, 770)"><rect width="752" height="290" fill="#fff" stroke="#a7f3d0" stroke-width="1.5" rx="14"/><rect width="752" height="42" fill="#10b981" rx="14"/><rect width="752" height="12" y="30" fill="#10b981"/><text x="20" y="28" fill="#fff" font-size="14" font-weight="700">DO claim</text><g transform="translate(20, 60)"><rect width="712" height="46" fill="#ecfdf5" rx="8"/><text x="14" y="20" fill="#475569" font-size="12">&quot;Agent capabilities exercised: <tspan fill="#065f46" font-weight="700">stateful multi-turn ReAct, oracle-grounded</tspan></text><text x="14" y="36" fill="#475569" font-size="12"><tspan fill="#065f46" font-weight="700">synthesis, server-enforced discipline, recoverable failure.</tspan>&quot;</text></g><g transform="translate(20, 116)"><rect width="712" height="46" fill="#ecfdf5" rx="8"/><text x="14" y="20" fill="#475569" font-size="12">&quot;75% pass first-try; <tspan fill="#065f46" font-weight="700">the 25% tail is the next experiment.</tspan>&quot;</text><text x="14" y="36" fill="#065f46" font-size="11" font-weight="600">→ Honest, technically substantive, points at a roadmap.</text></g><g transform="translate(20, 172)"><rect width="712" height="46" fill="#ecfdf5" rx="8"/><text x="14" y="20" fill="#475569" font-size="12">&quot;Reuse is the next dial — currently 1.0×, lever is</text><text x="14" y="36" fill="#475569" font-size="12"><tspan fill="#065f46" font-weight="700">prompt + tool_list-first guard.</tspan>&quot;</text></g><g transform="translate(20, 228)"><rect width="712" height="46" fill="#ecfdf5" rx="8"/><text x="14" y="20" fill="#475569" font-size="12">&quot;<tspan fill="#065f46" font-weight="700">The methodology (prompt + 18 tools + 4 guards) is the artifact</tspan> —</text><text x="14" y="36" fill="#475569" font-size="12">point any agent at it; the discipline holds. That&apos;s the moat.&quot;</text></g></g><text x="800" y="1112" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">The gap between aspiration and reality IS the finding. A measurable agent benchmark beats a polished demo with no instrumentation.</text></svg>
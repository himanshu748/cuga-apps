<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1600 920"><defs><filter id="shadow" width="104%" height="108%" x="-2%" y="-2%"><feDropShadow dx="0" dy="2" flood-opacity=".08" stdDeviation="3"/></filter></defs><rect width="1600" height="920" fill="#fafbfc"/><text x="800" y="42" fill="#0f172a" font-size="28" font-weight="700" text-anchor="middle">Agent capabilities tested across cuga-apps</text><text x="800" y="70" fill="#64748b" font-size="14" text-anchor="middle">8 capabilities · 24 apps · one app per capability is the deep exemplar (★); others exercise it more lightly</text><g><g transform="translate(50, 96) translate(0, 0)"><rect width="14" height="14" fill="#6366f1" rx="3"/><text x="22" y="12" fill="#475569" font-size="11"><tspan fill="#3b0764" font-weight="700">Foundational reasoning</tspan></text></g><g transform="translate(50, 96) translate(280, 0)"><rect width="14" height="14" fill="#0ea5e9" rx="3"/><text x="22" y="12" fill="#475569" font-size="11"><tspan fill="#0c4a6e" font-weight="700">Grounding &amp; input</tspan></text></g><g transform="translate(50, 96) translate(540, 0)"><rect width="14" height="14" fill="#8b5cf6" rx="3"/><text x="22" y="12" fill="#475569" font-size="11"><tspan fill="#3b0764" font-weight="700">Advanced synthesis</tspan></text></g><g><text x="0" y="12" fill="#f59e0b" font-size="14" font-weight="700" transform="translate(50, 96) translate(820, 0)">★</text><text x="18" y="12" fill="#475569" font-size="11" transform="translate(50, 96) translate(820, 0)">deep exemplar — exercises it most heavily</text></g></g><g filter="url(#shadow)" transform="translate(50, 144)"><rect width="360" height="276" fill="#fff" stroke="#c7d2fe" stroke-width="1.5" rx="12"/><rect width="360" height="40" fill="#6366f1" rx="12"/><rect width="360" height="12" y="28" fill="#6366f1"/><circle cx="22" cy="20" r="13" fill="#fff"/><text x="22" y="25" fill="#6366f1" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="44" y="25" fill="#fff" font-size="13" font-weight="700">Multi-turn ReAct loop</text><text x="318" y="25" fill="#e0e7ff" font-size="10" text-anchor="end">all 24</text><text x="14" y="64" fill="#475569" font-size="11.5" font-style="italic">Agent emits a tool call · sees observation ·</text><text x="14" y="80" fill="#475569" font-size="11.5" font-style="italic">decides next action · repeats until done.</text><text x="14" y="108" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">TEST SURFACE</text><text x="14" y="124" fill="#475569" font-size="11">CugaAgent.invoke(thread_id) — every app uses it.</text><text x="14" y="140" fill="#475569" font-size="11">Loop depth varies: 3-4 turns (paper_scout) up</text><text x="14" y="156" fill="#475569" font-size="11">to 13+ turns (bird).</text><text x="14" y="184" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">DEEP EXEMPLAR</text><g transform="translate(14, 196)"><rect width="200" height="22" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="4"/><text x="100" y="16" fill="#3b0764" font-size="11" font-weight="700" text-anchor="middle">★ bird_invocable_api</text></g><text x="14" y="240" fill="#64748b" font-size="10.5" font-style="italic">13 MCP calls per question on the trace shown.</text><text x="14" y="256" fill="#64748b" font-size="10.5" font-style="italic">Up to 2 retry rounds on validation failure.</text></g><g filter="url(#shadow)" transform="translate(430, 144)"><rect width="360" height="276" fill="#fff" stroke="#c7d2fe" stroke-width="1.5" rx="12"/><rect width="360" height="40" fill="#6366f1" rx="12"/><rect width="360" height="12" y="28" fill="#6366f1"/><circle cx="22" cy="20" r="13" fill="#fff"/><text x="22" y="25" fill="#6366f1" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="44" y="25" fill="#fff" font-size="13" font-weight="700">Multi-tool orchestration</text><text x="318" y="25" fill="#e0e7ff" font-size="10" text-anchor="end">single server</text><text x="14" y="64" fill="#475569" font-size="11.5" font-style="italic">Pick the right tool from a small toolkit</text><text x="14" y="80" fill="#475569" font-size="11.5" font-style="italic">based on what the question needs.</text><text x="14" y="108" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">TEST SURFACE</text><text x="14" y="124" fill="#475569" font-size="11">load_tools([single_server]) → 3+ tools bound</text><text x="14" y="140" fill="#475569" font-size="11">to the agent. LLM picks per turn.</text><text x="14" y="184" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">EXEMPLAR APPS</text><g transform="translate(14, 196)"><rect width="160" height="22" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="4"/><text x="80" y="16" fill="#3b0764" font-size="11" font-weight="700" text-anchor="middle">★ paper_scout · 4 tools</text></g><g transform="translate(180, 196)"><rect width="160" height="22" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="4"/><text x="80" y="16" fill="#3b0764" font-size="11" font-weight="700" text-anchor="middle">wiki_dive · 4 tools</text></g><g transform="translate(14, 224)"><rect width="160" height="22" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="4"/><text x="80" y="16" fill="#3b0764" font-size="11" font-weight="700" text-anchor="middle">code_reviewer · 3 tools</text></g><g transform="translate(180, 224)"><rect width="160" height="22" fill="#eef2ff" stroke="#6366f1" stroke-width="1" rx="4"/><text x="80" y="16" fill="#3b0764" font-size="11" font-weight="700" text-anchor="middle">webpage_summarizer</text></g></g><g filter="url(#shadow)" transform="translate(810, 144)"><rect width="360" height="276" fill="#fff" stroke="#a5f3fc" stroke-width="1.5" rx="12"/><rect width="360" height="40" fill="#0ea5e9" rx="12"/><rect width="360" height="12" y="28" fill="#0ea5e9"/><circle cx="22" cy="20" r="13" fill="#fff"/><text x="22" y="25" fill="#0ea5e9" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="44" y="25" fill="#fff" font-size="13" font-weight="700">Web grounding</text><text x="318" y="25" fill="#cffafe" font-size="10" text-anchor="end">live retrieval</text><text x="14" y="64" fill="#475569" font-size="11.5" font-style="italic">Real-time web search + page fetch +</text><text x="14" y="80" fill="#475569" font-size="11.5" font-style="italic">synthesis with citations.</text><text x="14" y="108" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">TEST SURFACE</text><text x="14" y="124" fill="#475569" font-size="11">mcp-web — Tavily search, fetch_webpage,</text><text x="14" y="140" fill="#475569" font-size="11">RSS, YouTube oEmbed/transcripts.</text><text x="14" y="184" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">EXEMPLAR APPS</text><g transform="translate(14, 196)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">★ web_researcher</text></g><g transform="translate(180, 196)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">ibm_docs_qa</text></g><g transform="translate(14, 224)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">ibm_whats_new</text></g><g transform="translate(180, 224)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">ibm_cloud_advisor</text></g></g><g filter="url(#shadow)" transform="translate(1190, 144)"><rect width="360" height="276" fill="#fff" stroke="#a5f3fc" stroke-width="1.5" rx="12"/><rect width="360" height="40" fill="#0ea5e9" rx="12"/><rect width="360" height="12" y="28" fill="#0ea5e9"/><circle cx="22" cy="20" r="13" fill="#fff"/><text x="22" y="25" fill="#0ea5e9" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="44" y="25" fill="#fff" font-size="13" font-weight="700">Multi-modal input</text><text x="318" y="25" fill="#cffafe" font-size="10" text-anchor="end">PDF · audio · video</text><text x="14" y="64" fill="#475569" font-size="11.5" font-style="italic">Accept files of different types; agent</text><text x="14" y="80" fill="#475569" font-size="11.5" font-style="italic">dispatches to the right extractor in-loop.</text><text x="14" y="108" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">TEST SURFACE</text><text x="14" y="124" fill="#475569" font-size="11">pdfplumber · python-pptx · faster-whisper</text><text x="14" y="140" fill="#475569" font-size="11">(audio + video) · transcription is in-agent.</text><text x="14" y="184" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">EXEMPLAR APPS</text><g transform="translate(14, 196)"><rect width="200" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="100" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">★ deck_forge · 6 modalities</text></g><g transform="translate(14, 224)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">video_qa</text></g><g transform="translate(180, 224)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">drop_summarizer</text></g></g><g filter="url(#shadow)" transform="translate(50, 440)"><rect width="360" height="276" fill="#fff" stroke="#a5f3fc" stroke-width="1.5" rx="12"/><rect width="360" height="40" fill="#0ea5e9" rx="12"/><rect width="360" height="12" y="28" fill="#0ea5e9"/><circle cx="22" cy="20" r="13" fill="#fff"/><text x="22" y="25" fill="#0ea5e9" font-size="12" font-weight="700" text-anchor="middle">5</text><text x="44" y="25" fill="#fff" font-size="13" font-weight="700">RAG over private corpus</text><text x="318" y="25" fill="#cffafe" font-size="10" text-anchor="end">semantic search</text><text x="14" y="64" fill="#475569" font-size="11.5" font-style="italic">Index user-supplied content, retrieve top-k</text><text x="14" y="80" fill="#475569" font-size="11.5" font-style="italic">chunks, ground generation in retrievals.</text><text x="14" y="108" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">TEST SURFACE</text><text x="14" y="124" fill="#475569" font-size="11">ChromaDB + sentence-transformers</text><text x="14" y="140" fill="#475569" font-size="11">(all-MiniLM-L6-v2) · 400/80 chunking</text><text x="14" y="184" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">EXEMPLAR APPS</text><g transform="translate(14, 196)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">★ deck_forge</text></g><g transform="translate(180, 196)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">video_qa</text></g><g transform="translate(14, 224)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">box_qa</text></g><g transform="translate(180, 224)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">voice_journal</text></g></g><g filter="url(#shadow)" transform="translate(430, 440)"><rect width="360" height="276" fill="#fff" stroke="#a5f3fc" stroke-width="1.5" rx="12"/><rect width="360" height="40" fill="#0ea5e9" rx="12"/><rect width="360" height="12" y="28" fill="#0ea5e9"/><circle cx="22" cy="20" r="13" fill="#fff"/><text x="22" y="25" fill="#0ea5e9" font-size="12" font-weight="700" text-anchor="middle">6</text><text x="44" y="25" fill="#fff" font-size="13" font-weight="700">Citation tracking</text><text x="318" y="25" fill="#cffafe" font-size="10" text-anchor="end">attributable</text><text x="14" y="64" fill="#475569" font-size="11.5" font-style="italic">Output must cite which source produced</text><text x="14" y="80" fill="#475569" font-size="11.5" font-style="italic">each claim — never fabricate references.</text><text x="14" y="108" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">TEST SURFACE</text><text x="14" y="124" fill="#475569" font-size="11">System prompt enforces [Title](url) format ·</text><text x="14" y="140" fill="#475569" font-size="11">&quot;never fabricate citation counts.&quot;</text><text x="14" y="184" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">EXEMPLAR APPS</text><g transform="translate(14, 196)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">★ paper_scout</text></g><g transform="translate(180, 196)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">web_researcher</text></g><g transform="translate(14, 224)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">wiki_dive</text></g><g transform="translate(180, 224)"><rect width="160" height="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="4"/><text x="80" y="16" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">hiking_research</text></g></g><g filter="url(#shadow)" transform="translate(810, 440)"><rect width="360" height="276" fill="#fff" stroke="#ddd6fe" stroke-width="1.5" rx="12"/><rect width="360" height="40" fill="#8b5cf6" rx="12"/><rect width="360" height="12" y="28" fill="#8b5cf6"/><circle cx="22" cy="20" r="13" fill="#fff"/><text x="22" y="25" fill="#8b5cf6" font-size="12" font-weight="700" text-anchor="middle">7</text><text x="44" y="25" fill="#fff" font-size="13" font-weight="700">Code synthesis + validation</text><text x="318" y="25" fill="#ede9fe" font-size="10" text-anchor="end">closed loop</text><text x="14" y="64" fill="#475569" font-size="11.5" font-style="italic">Agent writes runnable Python; system</text><text x="14" y="80" fill="#475569" font-size="11.5" font-style="italic">runs it against a known oracle.</text><text x="14" y="108" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">TEST SURFACE</text><text x="14" y="124" fill="#475569" font-size="11">tool_register → exec sandbox (sqlite3,</text><text x="14" y="140" fill="#475569" font-size="11">json, re only) → tool_call (mode=ro) →</text><text x="14" y="156" fill="#475569" font-size="11">seq_validate (set-equality vs gold SQL).</text><text x="14" y="184" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">DEEP EXEMPLAR</text><g transform="translate(14, 196)"><rect width="200" height="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" rx="4"/><text x="100" y="16" fill="#3b0764" font-size="11" font-weight="700" text-anchor="middle">★ bird_invocable_api</text></g><text x="14" y="240" fill="#64748b" font-size="10.5" font-style="italic">Only app in the suite that does this.</text><text x="14" y="256" fill="#64748b" font-size="10.5" font-style="italic">75% pass rate on california_schools.</text></g><g filter="url(#shadow)" transform="translate(1190, 440)"><rect width="360" height="276" fill="#fff" stroke="#ddd6fe" stroke-width="1.5" rx="12"/><rect width="360" height="40" fill="#8b5cf6" rx="12"/><rect width="360" height="12" y="28" fill="#8b5cf6"/><circle cx="22" cy="20" r="13" fill="#fff"/><text x="22" y="25" fill="#8b5cf6" font-size="12" font-weight="700" text-anchor="middle">8</text><text x="44" y="25" fill="#fff" font-size="13" font-weight="700">Self-correction loop</text><text x="318" y="25" fill="#ede9fe" font-size="10" text-anchor="end">retry on failure</text><text x="14" y="64" fill="#475569" font-size="11.5" font-style="italic">Agent reads failure_msg → identifies the</text><text x="14" y="80" fill="#475569" font-size="11.5" font-style="italic">offending step → fixes → re-validates.</text><text x="14" y="108" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">TEST SURFACE</text><text x="14" y="124" fill="#475569" font-size="11">seq_validate returns failure_msg with diff;</text><text x="14" y="140" fill="#475569" font-size="11">prompt instructs ≤2 retries before</text><text x="14" y="156" fill="#475569" font-size="11">falling back to a single-tool sequence.</text><text x="14" y="184" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing=".06em">DEEP EXEMPLAR</text><g transform="translate(14, 196)"><rect width="200" height="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" rx="4"/><text x="100" y="16" fill="#3b0764" font-size="11" font-weight="700" text-anchor="middle">★ bird_invocable_api</text></g><text x="14" y="240" fill="#64748b" font-size="10.5" font-style="italic">Also forbidden_name + near-duplicate</text><text x="14" y="256" fill="#64748b" font-size="10.5" font-style="italic">guards push back; agent renames + retries.</text></g><g filter="url(#shadow)" transform="translate(50, 740)"><rect width="1500" height="100" fill="#fff" stroke="#cbd5e1" rx="14"/><text x="20" y="28" fill="#0f172a" font-size="14" font-weight="700">What this matrix tells you about the suite</text><g><text x="0" y="14" fill="#475569" font-size="11.5" transform="translate(20, 44)"><tspan fill="#10b981" font-weight="700">Caps 1–2</tspan> are universal — every app loops + picks tools. That&apos;s the baseline &quot;does CUGA work&quot; check; table stakes.</text><text x="0" y="34" fill="#475569" font-size="11.5" transform="translate(20, 44)"><tspan fill="#0ea5e9" font-weight="700">Caps 3–6</tspan> (web · multi-modal · RAG · citations) split the apps into the substantive groups: <tspan font-style="italic">research-flavored</tspan>, <tspan font-style="italic">document-flavored</tspan>, <tspan font-style="italic">media-flavored</tspan>.</text><text x="0" y="54" fill="#475569" font-size="11.5" transform="translate(20, 44)"><tspan fill="#8b5cf6" font-weight="700">Caps 7–8</tspan> (code synthesis + self-correction) are the deepest agent stress-test — and only <tspan font-family="monospace" font-weight="700">bird_invocable_api</tspan> exercises them. Single biggest IP in the suite.</text></g></g><text x="800" y="890" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">If a future evaluator asks &quot;what does this suite actually exercise about an agent?&quot; — this matrix is the answer. Each cap is reproducible, measurable, and testable in isolation.</text></svg>
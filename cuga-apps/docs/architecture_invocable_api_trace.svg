l="#78350f" font-family="monospace" font-size="11">→ {passed: <tspan font-weight="700">true</tspan>, gold_result: [...], final_result: [...], failure_msg: null}</text><text x="14" y="100" fill="#78350f" font-family="monospace" font-size="11">→ outcome persisted to validations table</text></g></g><g><text x="0" y="14" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".08em" transform="translate(40, 1158)">EMITTED ARTIFACT · output/california_schools/dataset.json[28] · ALL FIELDS POPULATED</text><text x="700" y="14" fill="#475569" font-size="11" transform="translate(40, 1158)">tools.py +2 functions · tools.json +2 entries · validation_report.passed_count++</text><text x="1300" y="14" fill="#10b981" font-size="11" font-weight="700" transform="translate(40, 1158)">✓ validated: true</text></g></svg>
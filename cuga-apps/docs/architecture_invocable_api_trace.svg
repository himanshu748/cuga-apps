<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1600 1200"><defs><filter id="shadow" width="104%" height="108%" x="-2%" y="-2%"><feDropShadow dx="0" dy="2" flood-opacity=".08" stdDeviation="3"/></filter><marker id="arrowR" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1600" height="1200" fill="#fafbfc"/><text x="800" y="42" fill="#0f172a" font-size="28" font-weight="700" text-anchor="middle">Invocable API Synthesis · Trace for Bird qid 28 · california_schools</text><text x="800" y="70" fill="#64748b" font-size="14" text-anchor="middle">13 MCP tool calls · 5 phases · ends with a validated 2-step sequence + 2 registered tools</text><g filter="url(#shadow)" transform="translate(40, 90)"><rect width="1520" height="200" fill="#fff" stroke="#cbd5e1" rx="14"/><rect width="1520" height="36" fill="#0f172a" rx="14"/><rect width="1520" height="12" y="24" fill="#0f172a"/><text x="20" y="24" fill="#fff" font-size="13" font-weight="700">INPUT · one Bird record</text><text x="1500" y="24" fill="#94a3b8" font-size="11" font-style="italic" text-anchor="end">db = california_schools, qid = 28, difficulty = challenging</text><text x="20" y="60" fill="#475569" font-size="11" font-weight="700" letter-spacing=".06em">NATURAL-LANGUAGE QUESTION</text><text x="20" y="84" fill="#0f172a" font-size="13">&quot;Consider the average difference between K-12 enrollment and 15-17 enrollment of schools that are locally funded,</text><text x="20" y="102" fill="#0f172a" font-size="13">list the names and DOC type of schools which has a difference above this average.&quot;</text><text x="20" y="130" fill="#475569" font-size="11" font-weight="700" letter-spacing=".06em">GOLD SQL · has a SUBQUERY in WHERE → decomposition signal</text><rect width="1100" height="50" x="20" y="138" fill="#0f172a" rx="6"/><text x="32" y="156" fill="#cbd5e1" font-family="monospace" font-size="11">SELECT T2.School, T2.DOC FROM frpm T1 INNER JOIN schools T2 ON T1.CDSCode = T2.CDSCode</text><text x="32" y="170" fill="#cbd5e1" font-family="monospace" font-size="11">WHERE T2.FundingType = &apos;Locally funded&apos; AND (T1.`Enrollment (K-12)` - T1.`Enrollment (Ages 5-17)`)</text><text x="32" y="184" fill="#fde68a" font-family="monospace" font-size="11">&gt; (SELECT AVG(T3.`Enrollment (K-12)` - T3.`Enrollment (Ages 5-17)`) FROM frpm T3 ... WHERE T4.FundingType = &apos;Locally funded&apos;)</text><g transform="translate(1140, 138)"><rect width="360" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="8"/><text x="14" y="20" fill="#78350f" font-size="11" font-weight="700">GOLD RESULT</text><text x="14" y="38" fill="#78350f" font-size="12"><tspan font-weight="700">57 rows</tspan> of (School, DOC) · the oracle</text></g></g><g><text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".08em" transform="translate(40, 304)">TOOL-CALL TRACE · color = MCP tool family</text><g transform="translate(40, 304) translate(360, -10)"><rect width="14" height="14" fill="#0ea5e9" rx="3"/><text x="20" y="11" fill="#475569" font-size="11"><tspan font-weight="600">db_*</tspan> / <tspan font-weight="600">bird_*</tspan> read-only inspection</text></g><g transform="translate(40, 304) translate(640, -10)"><rect width="14" height="14" fill="#8b5cf6" rx="3"/><text x="20" y="11" fill="#475569" font-size="11"><tspan font-weight="600">tool_register</tspan> mutation</text></g><g transform="translate(40, 304) translate(900, -10)"><rect width="14" height="14" fill="#10b981" rx="3"/><text x="20" y="11" fill="#475569" font-size="11"><tspan font-weight="600">tool_call</tspan> / <tspan font-weight="600">tool_list</tspan> execution</text></g><g transform="translate(40, 304) translate(1200, -10)"><rect width="14" height="14" fill="#f59e0b" rx="3"/><text x="20" y="11" fill="#475569" font-size="11"><tspan font-weight="600">seq_*</tspan> sequence + validation</text></g></g><g transform="translate(40, 320)"><rect width="1520" height="28" fill="#0f172a" rx="6"/><text x="14" y="19" fill="#fff" font-size="12" font-weight="700">PHASE 1 · ORIENT · read schema, oracle, value vocabularies — no hallucinated columns</text><text x="1506" y="19" fill="#94a3b8" font-size="11" text-anchor="end">7 steps</text></g><g><g filter="url(#shadow)" transform="translate(40, 358)"><rect width="200" height="106" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><circle cx="22" cy="22" r="13" fill="#0ea5e9"/><text x="22" y="27" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="42" y="27" fill="#0c4a6e" font-family="monospace" font-size="11.5" font-weight="700">bird_get_question</text><text x="14" y="50" fill="#64748b" font-size="10">args: db, qid=28</text><line x1="14" x2="186" y1="58" y2="58" stroke="#e2e8f0"/><text x="14" y="74" fill="#0c4a6e" font-size="10" font-weight="700">→</text><text x="26" y="74" fill="#475569" font-size="10">NL + evidence + gold</text><text x="26" y="88" fill="#475569" font-size="10">SQL + difficulty</text></g><g filter="url(#shadow)" transform="translate(40, 358) translate(220, 0)"><rect width="200" height="106" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><circle cx="22" cy="22" r="13" fill="#0ea5e9"/><text x="22" y="27" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="42" y="27" fill="#0c4a6e" font-family="monospace" font-size="11.5" font-weight="700">bird_run_gold</text><text x="14" y="50" fill="#64748b" font-size="10">args: db, qid=28</text><line x1="14" x2="186" y1="58" y2="58" stroke="#e2e8f0"/><text x="14" y="74" fill="#0c4a6e" font-size="10" font-weight="700">→</text><text x="26" y="74" fill="#475569" font-size="10"><tspan font-weight="700">57 rows</tspan> of (School, DOC)</text><text x="26" y="88" fill="#475569" font-size="10">— this is the target</text></g><g filter="url(#shadow)" transform="translate(40, 358) translate(440, 0)"><rect width="200" height="106" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><circle cx="22" cy="22" r="13" fill="#0ea5e9"/><text x="22" y="27" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="42" y="27" fill="#0c4a6e" font-family="monospace" font-size="11.5" font-weight="700">db_get_schema</text><text x="14" y="50" fill="#64748b" font-size="10">args: db</text><line x1="14" x2="186" y1="58" y2="58" stroke="#e2e8f0"/><text x="14" y="74" fill="#0c4a6e" font-size="10" font-weight="700">→</text><text x="26" y="74" fill="#475569" font-size="10">DDL + foreign keys</text><text x="26" y="88" fill="#475569" font-size="10">— column names verified</text></g><g filter="url(#shadow)" transform="translate(40, 358) translate(660, 0)"><rect width="200" height="106" fill="#fff" stroke="#10b981" stroke-width="1.5" rx="10"/><circle cx="22" cy="22" r="13" fill="#10b981"/><text x="22" y="27" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="42" y="27" fill="#065f46" font-family="monospace" font-size="11.5" font-weight="700">tool_list</text><text x="14" y="50" fill="#64748b" font-size="10">args: db</text><line x1="14" x2="186" y1="58" y2="58" stroke="#e2e8f0"/><text x="14" y="74" fill="#065f46" font-size="10" font-weight="700">→</text><text x="26" y="74" fill="#475569" font-size="10">[ ] empty registry</text><text x="26" y="88" fill="#475569" font-size="10">(reuse-first check)</text></g><g filter="url(#shadow)" transform="translate(40, 358) translate(880, 0)"><rect width="200" height="106" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><circle cx="22" cy="22" r="13" fill="#0ea5e9"/><text x="22" y="27" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">5</text><text x="42" y="27" fill="#0c4a6e" font-family="monospace" font-size="11.5" font-weight="700">db_sample_rows</text><text x="14" y="50" fill="#64748b" font-size="10">table=schools, n=5</text><line x1="14" x2="186" y1="58" y2="58" stroke="#e2e8f0"/><text x="14" y="74" fill="#0c4a6e" font-size="10" font-weight="700">→</text><text x="26" y="74" fill="#475569" font-size="10">FundingType = free-text</text><text x="26" y="88" fill="#475569" font-size="10">→ need DISTINCT next</text></g><g filter="url(#shadow)" transform="translate(40, 358) translate(1100, 0)"><rect width="200" height="106" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><circle cx="22" cy="22" r="13" fill="#0ea5e9"/><text x="22" y="27" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">6</text><text x="42" y="27" fill="#0c4a6e" font-family="monospace" font-size="11.5" font-weight="700">db_run_sql</text><text x="14" y="50" fill="#64748b" font-size="10">DISTINCT FundingType</text><line x1="14" x2="186" y1="58" y2="58" stroke="#e2e8f0"/><text x="14" y="74" fill="#0c4a6e" font-size="10" font-weight="700">→</text><text x="26" y="74" fill="#475569" font-size="10">Directly · Locally ·</text><text x="26" y="88" fill="#475569" font-size="10">Not in CS funding model</text></g><g filter="url(#shadow)" transform="translate(40, 358) translate(1320, 0)"><rect width="200" height="106" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><circle cx="22" cy="22" r="13" fill="#0ea5e9"/><text x="22" y="27" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">7</text><text x="42" y="27" fill="#0c4a6e" font-family="monospace" font-size="11.5" font-weight="700">db_sample_rows</text><text x="14" y="50" fill="#64748b" font-size="10">table=frpm, n=5</text><line x1="14" x2="186" y1="58" y2="58" stroke="#e2e8f0"/><text x="14" y="74" fill="#0c4a6e" font-size="10" font-weight="700">→</text><text x="26" y="74" fill="#475569" font-size="10">columns w/ backticks:</text><text x="26" y="88" fill="#475569" font-size="10">&quot;Enrollment (K-12)&quot;</text></g></g><g transform="translate(40, 484)"><rect width="1520" height="36" fill="#312e81" rx="8"/><text x="20" y="22" fill="#fde68a" font-size="12" font-weight="700">↓ DECISION ·</text><text x="140" y="22" fill="#e0e7ff" font-size="12">Subquery in WHERE → 2-tool decomposition. Tool A computes the AVG; Tool B filters by FundingType + threshold. Slot examples for funding_type exclude &quot;Locally funded&quot; (the answer literal).</text></g><g transform="translate(40, 532)"><rect width="1520" height="28" fill="#0f172a" rx="6"/><text x="14" y="19" fill="#fff" font-size="12" font-weight="700">PHASE 2 · REGISTER TOOL 1 · the inner aggregate (the &quot;AVG&quot; in the subquery)</text><text x="1506" y="19" fill="#94a3b8" font-size="11" text-anchor="end">1 step</text></g><g filter="url(#shadow)" transform="translate(40, 570)"><rect width="1520" height="106" fill="#fff" stroke="#8b5cf6" stroke-width="1.5" rx="10"/><circle cx="28" cy="28" r="14" fill="#8b5cf6"/><text x="28" y="33" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">8</text><text x="52" y="33" fill="#3b0764" font-family="monospace" font-size="13" font-weight="700">tool_register(name=&quot;avg_enrollment_difference_by_funding_type&quot;, params_schema={...funding_type...}, code=&quot;def run(conn, funding_type): ...&quot;, description=&quot;...&quot;)</text><line x1="14" x2="1506" y1="50" y2="50" stroke="#e2e8f0"/><text x="14" y="70" fill="#3b0764" font-size="11" font-weight="700">SERVER GUARDS RUN →</text><rect width="200" height="20" x="170" y="58" fill="#f5f3ff" stroke="#c4b5fd" rx="10"/><text x="270" y="71" fill="#3b0764" font-size="10.5" text-anchor="middle">forbidden-name pattern ✓</text><rect width="220" height="20" x="380" y="58" fill="#f5f3ff" stroke="#c4b5fd" rx="10"/><text x="490" y="71" fill="#3b0764" font-size="10.5" text-anchor="middle">SQL skeleton near-dup ✓ (empty)</text><rect width="220" height="20" x="610" y="58" fill="#f5f3ff" stroke="#c4b5fd" rx="10"/><text x="720" y="71" fill="#3b0764" font-size="10.5" text-anchor="middle">name-token Jaccard ≥0.85 ✓</text><rect width="240" height="20" x="840" y="58" fill="#f5f3ff" stroke="#c4b5fd" rx="10"/><text x="960" y="71" fill="#3b0764" font-size="10.5" text-anchor="middle">_compile_tool() — exec sandbox ✓</text><text x="14" y="96" fill="#475569" font-size="11">→ <tspan fill="#3b0764" font-weight="700">{registered: true}</tspan> · row inserted into state/california_schools.db / table tools</text></g><g transform="translate(40, 696)"><rect width="1520" height="28" fill="#0f172a" rx="6"/><text x="14" y="19" fill="#fff" font-size="12" font-weight="700">PHASE 3 · SMOKE-TEST TOOL 1 · required by the prompt — fail fast on column typos / wrong placeholders</text><text x="1506" y="19" fill="#94a3b8" font-size="11" text-anchor="end">1 step</text></g><g filter="url(#shadow)" transform="translate(40, 734)"><rect width="1520" height="76" fill="#fff" stroke="#10b981" stroke-width="1.5" rx="10"/><circle cx="28" cy="28" r="14" fill="#10b981"/><text x="28" y="33" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">9</text><text x="52" y="33" fill="#065f46" font-family="monospace" font-size="13" font-weight="700">tool_call(name=&quot;avg_enrollment_difference_by_funding_type&quot;, args={&quot;funding_type&quot;: &quot;Locally funded&quot;})</text><text x="14" y="60" fill="#475569" font-size="11">→ runs the registered code on a <tspan fill="#065f46" font-family="monospace" font-weight="700">mode=ro</tspan> SQLite connection → <tspan fill="#065f46" font-family="monospace" font-weight="700">{output: {&quot;avg_difference&quot;: 16.7…}}</tspan> · smoke-test passes</text></g><g transform="translate(40, 830)"><rect width="1520" height="28" fill="#0f172a" rx="6"/><text x="14" y="19" fill="#fff" font-size="12" font-weight="700">PHASE 4 · REGISTER + TEST TOOL 2 · the outer filter (uses the avg as a threshold)</text><text x="1506" y="19" fill="#94a3b8" font-size="11" text-anchor="end">2 steps</text></g><g><g filter="url(#shadow)" transform="translate(40, 868)"><rect width="750" height="106" fill=
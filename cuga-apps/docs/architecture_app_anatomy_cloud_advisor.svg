<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1600 1200"><defs><filter id="shadow" width="104%" height="108%" x="-2%" y="-2%"><feDropShadow dx="0" dy="2" flood-opacity=".08" stdDeviation="3"/></filter><marker id="arrowR" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrowL" markerHeight="7" markerWidth="7" orient="auto" refX="1" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 10 0 L 0 5 L 10 10 z"/></marker></defs><rect width="1600" height="1200" fill="#fafbfc"/><text x="800" y="42" fill="#0f172a" font-size="30" font-weight="700" text-anchor="middle">Anatomy of a cuga-app — ibm_cloud_advisor</text><text x="800" y="72" fill="#64748b" font-size="15" text-anchor="middle">Mixed-mode tools: an inline @tool that talks to a domain API + an MCP tool from mcp-web. The system prompt enforces &quot;catalog before recommendation&quot;.</text><g filter="url(#shadow)" transform="translate(40, 110)"><rect width="380" height="220" fill="#fff" stroke="#cbd5e1" rx="12"/><rect width="380" height="38" fill="#0f172a" rx="12"/><rect width="380" height="12" y="26" fill="#0f172a"/><text x="20" y="25" fill="#fff" font-size="14" font-weight="700">File layout</text><text x="20" y="68" fill="#0f172a" font-family="monospace" font-size="12.5">apps/ibm_cloud_advisor/</text><text x="36" y="90" fill="#475569" font-family="monospace" font-size="12">├── main.py</text><text x="280" y="90" fill="#94a3b8" font-size="11" font-style="italic">FastAPI + agent</text><text x="36" y="110" fill="#475569" font-family="monospace" font-size="12">├── ui.py</text><text x="280" y="110" fill="#94a3b8" font-size="11" font-style="italic">_HTML chat UI</text><text x="36" y="130" fill="#475569" font-family="monospace" font-size="12">├── README.md</text><text x="36" y="150" fill="#475569" font-family="monospace" font-size="12">└── requirements.txt</text><line x1="20" x2="360" y1="170" y2="170" stroke="#e2e8f0"/><text x="20" y="190" fill="#475569" font-size="11.5" font-weight="700">Domain endpoint hit by inline tool</text><text x="20" y="207" fill="#64748b" font-family="monospace" font-size="10.5">globalcatalog.cloud.ibm.com/api/v1</text></g><g filter="url(#shadow)" transform="translate(440, 110)"><rect width="700" height="220" fill="#fff" stroke="#cbd5e1" rx="12"/><rect width="700" height="38" fill="#312e81" rx="12"/><rect width="700" height="12" y="26" fill="#312e81"/><text x="20" y="25" fill="#fff" font-size="14" font-weight="700">Agent factory — inline + MCP tools mixed in one list</text><rect width="660" height="146" x="20" y="58" fill="#0f172a" rx="8"/><text x="32" y="80" fill="#cbd5e1" font-family="monospace" font-size="12">def _make_tools():</text><text x="48" y="100" fill="#cbd5e1" font-family="monospace" font-size="12">@</text><text x="56" y="100" fill="#a5b4fc" font-family="monospace" font-size="12">tool</text><text x="48" y="118" fill="#cbd5e1" font-family="monospace" font-size="12">def</text><text x="80" y="118" fill="#fde68a" font-family="monospace" font-size="12">search_ibm_catalog</text><text x="220" y="118" fill="#cbd5e1" font-family="monospace" font-size="12">(query: str) -&gt; str:</text><text x="396" y="118" fill="#9ca3af" font-family="monospace" font-size="11"># inline (app-specific)</text><text x="64" y="136" fill="#cbd5e1" font-family="monospace" font-size="12">…hit IBM Cloud Global Catalog directly…</text><text x="48" y="160" fill="#cbd5e1" font-family="monospace" font-size="12">web_tools =</text><text x="148" y="160" fill="#a5b4fc" font-family="monospace" font-size="12">load_tools</text><text x="226" y="160" fill="#cbd5e1" font-family="monospace" font-size="12">([</text><text x="240" y="160" fill="#86efac" font-family="monospace" font-size="12">&quot;web&quot;</text><text x="276" y="160" fill="#cbd5e1" font-family="monospace" font-size="12">])</text><text x="396" y="160" fill="#9ca3af" font-family="monospace" font-size="11"># MCP (shared)</text><text x="48" y="180" fill="#cbd5e1" font-family="monospace" font-size="12">return [search_ibm_catalog, *web_tools]</text><text x="32" y="198" fill="#94a3b8" font-family="monospace" font-size="11" font-style="italic"># Pattern: inline = app-specific domain · MCP = shared, reusable across apps</text></g><g filter="url(#shadow)" transform="translate(1160, 110)"><rect width="400" height="220" fill="#fff" stroke="#475569" stroke-width="1.5" rx="12"/><rect width="400" height="38" fill="#475569" rx="12"/><rect width="400" height="12" y="26" fill="#475569"/><text x="20" y="25" fill="#fff" font-size="14" font-weight="700">Tools bound — 2 sources, 1 catalog</text><text x="20" y="62" fill="#0f172a" font-size="11.5" font-weight="700">Inline @tool (kept local)</text><g transform="translate(20, 70)"><rect width="360" height="40" fill="#f1f5f9" stroke="#475569" stroke-width="1" rx="8"/><text x="14" y="18" fill="#0f172a" font-family="monospace" font-size="11.5" font-weight="700">search_ibm_catalog(query)</text><text x="14" y="32" fill="#64748b" font-size="10">→ IBM Global Catalog · service names, descriptions, URLs</text></g><text x="20" y="130" fill="#0c4a6e" font-size="11.5" font-weight="700">From mcp-web (29100)</text><g transform="translate(20, 138)"><rect width="360" height="40" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="8"/><text x="14" y="18" fill="#0c4a6e" font-family="monospace" font-size="11.5" font-weight="700">web_search(query)</text><text x="14" y="32" fill="#64748b" font-size="10">→ Tavily · narrowed via &quot;site:ibm.com OR site:cloud.ibm.com&quot;</text></g><text x="20" y="194" fill="#475569" font-size="10.5" font-style="italic">Why inline? IBM Catalog API doesn&apos;t fit any existing</text><text x="20" y="208" fill="#475569" font-size="10.5" font-style="italic">MCP server theme; only this app uses it.</text></g><line x1="40" x2="1560" y1="365" y2="365" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="800" y="395" fill="#475569" font-size="13" font-weight="700" letter-spacing=".05em" text-anchor="middle">REQUEST FLOW — POST /ask &quot;Design a HIPAA-compliant queue-based image processor on IBM Cloud&quot;</text><g><g transform="translate(40, 420) translate(0, 0)"><rect width="280" height="48" fill="#0f172a" rx="10"/><text x="140" y="22" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">User browser</text><text x="140" y="38" fill="#cbd5e1" font-size="11" text-anchor="middle">vanilla JS · _HTML from ui.py</text></g><g transform="translate(40, 420) translate(304, 0)"><rect width="280" height="48" fill="#10b981" rx="10"/><text x="140" y="22" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">FastAPI shell · main.py</text><text x="140" y="38" fill="#d1fae5" font-size="11" text-anchor="middle">/ask + inline tool body</text></g><g transform="translate(40, 420) translate(608, 0)"><rect width="280" height="48" fill="#6366f1" rx="10"/><text x="140" y="22" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">CugaAgent · cuga.sdk</text><text x="140" y="38" fill="#e0e7ff" font-size="11" text-anchor="middle">prompt: &quot;catalog FIRST, then web&quot;</text></g><g transform="translate(40, 420) translate(912, 0)"><rect width="280" height="48" fill="#475569" rx="10"/><text x="140" y="22" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Tool dispatch (split path)</text><text x="140" y="38" fill="#cbd5e1" font-size="11" text-anchor="middle">inline · or · _mcp_bridge</text></g><g transform="translate(40, 420) translate(1216, 0)"><rect width="304" height="48" fill="#f59e0b" rx="10"/><text x="152" y="22" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">External APIs</text><text x="152" y="38" fill="#fef3c7" font-size="11" text-anchor="middle">IBM Global Catalog · Tavily</text></g></g><g stroke="#e2e8f0" stroke-dasharray="2 4"><line x1="332" x2="332" y1="478" y2="1090"/><line x1="636" x2="636" y1="478" y2="1090"/><line x1="940" x2="940" y1="478" y2="1090"/><line x1="1244" x2="1244" y1="478" y2="1090"/></g><g filter="url(#shadow)" transform="translate(50, 500)"><rect width="260" height="56" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="10"/><circle cx="22" cy="28" r="14" fill="#0f172a"/><text x="22" y="33" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="46" y="22" fill="#0f172a" font-size="12" font-weight="700">User describes app</text><text x="46" y="42" fill="#475569" font-size="11">queue + processor + HIPAA</text></g><line x1="312" x2="354" y1="528" y2="528" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowR)"/><text x="333" y="520" fill="#475569" font-size="9.5" font-style="italic" text-anchor="middle">POST /ask</text><g filter="url(#shadow)" transform="translate(354, 500)"><rect width="260" height="56" fill="#fff" stroke="#10b981" stroke-width="1.2" rx="10"/><circle cx="22" cy="28" r="14" fill="#10b981"/><text x="22" y="33" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="46" y="22" fill="#064e3b" font-size="12" font-weight="700">Validate AskReq</text><text x="46" y="42" fill="#475569" font-family="monospace" font-size="11">await agent.invoke(...)</text></g><line x1="616" x2="658" y1="528" y2="528" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowR)"/><g filter="url(#shadow)" transform="translate(658, 500)"><rect width="260" height="56" fill="#fff" stroke="#6366f1" stroke-width="1.2" rx="10"/><circle cx="22" cy="28" r="14" fill="#6366f1"/><text x="22" y="33" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="46" y="22" fill="#1e1b4b" font-size="12" font-weight="700">Read system prompt</text><text x="46" y="42" fill="#475569" font-size="11">&quot;catalog FIRST, then optional web&quot;</text></g><g filter="url(#shadow)" transform="translate(658, 580)"><rect width="260" height="56" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" rx="10"/><circle cx="22" cy="28" r="14" fill="#6366f1"/><text x="22" y="33" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="46" y="22" fill="#1e1b4b" font-size="12" font-weight="700">search_ibm_catalog</text><text x="46" y="42" fill="#475569" font-size="11">query: &quot;message queue&quot;</text></g><line x1="920" x2="962" y1="608" y2="608" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowR)"/><g filter="url(#shadow)" transform="translate(962, 580)"><rect width="260" height="56" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" rx="10"/><text x="20" y="22" fill="#0f172a" font-size="11.5" font-weight="700">INLINE path</text><text x="20" y="42" fill="#475569" font-size="11">→ urllib.request directly</text></g><line x1="1224" x2="1266" y1="608" y2="608" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowR)"/><g filter="url(#shadow)" transform="translate(1266, 580)"><rect width="284" height="56" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" rx="10"/><text x="20" y="22" fill="#78350f" font-size="11.5" font-weight="700">IBM Global Catalog API</text><text x="20" y="42" fill="#475569" font-size="11">→ {messages-for-rabbitmq, event-streams, ...}</text></g><g filter="url(#shadow)" transform="translate(658, 660)"><rect width="260" height="56" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" rx="10"/><circle cx="22" cy="28" r="14" fill="#6366f1"/><text x="22" y="33" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="46" y="22" fill="#1e1b4b" font-size="12" font-weight="700">search_ibm_catalog (×2 more)</text><text x="46" y="42" fill="#475569" font-size="11">&quot;object storage&quot;, &quot;serverless functions&quot;</text></g><line x1="920" x2="962" y1="688" y2="688" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowR)"/><g filter="url(#shadow)" transform="translate(962, 660)"><rect width="260" height="56" fill="#f1f5f9" stroke="#475569" stroke-width="1.2" rx="10"/><text x="20" y="22" fill="#0f172a" font-size="11.5" font-weight="700">INLINE path (still)</text><text x="20" y="42" fill="#475569" font-size="11">same domain, different keywords</text></g><line x1="1224" x2="1266" y1="688" y2="688" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowR)"/><g filter="url(#shadow)" transform="translate(1266, 660)"><rect width="284" height="56" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" rx="10"/><text x="20" y="22" fill="#78350f" font-size="11.5" font-weight="700">→ {cloud-object-storage, code-engine, ...}</text><text x="20" y="42" fill="#16a34a" font-size="11" font-style="italic">candidate services confirmed by catalog</text></g><g filter="url(#shadow)" transform="translate(658, 740)"><rect width="260" height="56" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2" rx="10"/><circle cx="22" cy="28" r="14" fill="#6366f1"/><text x="22" y="33" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">6</text><text x="46" y="22" fill="#1e1b4b" font-size="12" font-weight="700">web_search (MCP path)</text><text x="46" y="42" fill="#475569" font-size="11">&quot;HIPAA cloud-object-storage site:ibm.com&quot;</text></g><line x1="920" x2="962" y1="768" y2="768" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowR)"/><g filter="url(#shadow)" transform="translate(962, 740)"><rect width="260" height="56" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.2" rx="10"/><text x="20" y="22" fill="#0c4a6e" font-size="11.5" font-weight="700">MCP path · _mcp_bridge</text><text x="20" y="42" fill="#475569" font-size="11">→ mcp-web on :29100</text></g><line x1="1224" x2="1266" y1="768" y2="768" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowR)"/><g filter="url(#shadow)" transform="translate(1266, 740)"><rect width="284" height="56" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" rx="10"/><text x="20" y="22" fill="#78350f" font-size="11.5" font-weight="700">Tavily search</text><text x="20" y="42" fill="#475569" font-size="11">→ FSCloud-certified compliance docs</text></g><g filter="url(#shadow)" transform="translate(658, 820)"><rect width="260" height="74" fill="#fff" stroke="#6366f1" stroke-width="1.2" rx="10"/><circle cx="22" cy="37" r="14" fill="#6366f1"/><text x="22" y="42" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">7</text><text x="46" y="22" fill="#1e1b4b" font-size="12" font-weight="700">Synthesize architecture</text><text x="46" y="40" fill="#475569" font-size="11">3-7 services · roles · data flow</text><text x="46" y="55" fill="#475569" font-size="11">+ ibmcloud CLI commands</text><text x="46" y="68" fill="#475569" font-size="11">+ cost indication (Lite vs paid)</text></g><line x1="658" x2="616" y1="857" y2="857" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowL)"/><text x="637" y="848" fill="#475569" font-size="9.5" font-style="italic" text-anchor="middle">result.answer</text><g filter="url(#shadow)" transform="translate(354, 820)"><rect width="260" height="74" fill="#fff" stroke="#10b981" stroke-width="1.2" rx="10"/><circle cx="22" cy="37" r="14" fill="#10b981"/><text x="22" y="42" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">8</text><text x="46" y="22" fill="#064e3b" font-size="12" font-weight="700">JSON response</text><text x="46" y="40" fill="#475569" font-family="monospace" font-size="11">{&quot;answer&quot;: &quot;...markdown...&quot;}</text><text x="46" y="55" fill="#475569" font-size="11">structured per system prompt:</text><text x="46" y="68" fill="#475569" font-size="11">name → services → flow → CLI → cost</text></g><line x1="354" x2="312" y1="857" y2="857" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowL)"/><g filter="url(#shadow)" transform="translate(50, 820)"><rect width="260" height="74" fill="#fff" stroke="#0f172a" stroke-width="1.2" rx="10"/><circle cx="22" cy="37" r="14" fill="#0f172a"/><text x="22" y="42" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">9</text><text x="46" y="22" fill="#0f172a" font-size="12" font-weight="700">UI renders architecture</text><text x="46" y="40" fill="#475569" font-size="11">markdown → service cards</text><text x="46" y="55" fill="#475569" font-size="11">copyable CLI block</text><text x="46" y="68" fill="#475569" font-size="11">cost panel + estimator link</text></g><g transform="translate(948, 920)"><rect width="280" height="80" fill="#fff" stroke="#475569" stroke-dasharray="3 3" stroke-width="1" rx="10"/><text x="14" y="20" fill="#0f172a" font-size="11.5" font-weight="700">The split tool path matters</text><text x="14" y="38" fill="#475569" font-size="10.5">Inline tool runs in main.py&apos;s process —</text><text x="14" y="51" fill="#475569" font-size="10.5">no MCP overhead. MCP tool round-trips</text><text x="14" y="64" fill="#475569" font-size="10.5">over HTTP. To the LLM, both look</text><text x="14" y="77" fill="#475569" font-size="10.5">identical via the LangChain interface.</text></g><g filter="url(#shadow)" transform="translate(40, 1024)"><rect width="1520" height="160" fill="#fff" stroke="#cbd5e1" rx="14"/><text x="20" y="30" fill="#0f172a" font-size="14" font-weight="700">Why this matters — the mixed-tool pattern, made concrete</text><g transform="translate(20, 46)"><rect width="365" height="100" fill="#f1f5f9" rx="10"/><text x="14" y="22" fill="#0f172a" font-size="11.5" font-weight="700">Inline vs MCP — the rule</text><text x="14" y="40" fill="#475569" font-size="11">App-specific domain → inline @tool.</text><text x="14" y="56" fill="#475569" font-size="11">Shared, stateless, themed → MCP.</text><text x="14" y="74" fill="#475569" font-size="11">IBM Catalog only this app uses → kept</text><text x="14" y="90" fill="#475569" font-size="11">inline. web_search → mcp-web (8 apps).</text></g><g transform="translate(405, 46)"><rect width="365" height="100" fill="#eef2ff" rx="10"/><text x="14" y="22" fill="#312e81" font-size="11.5" font-weight="700">Prompt enforces grounding</text><text x="14" y="40" fill="#475569" font-size="11">&quot;Only recommend services confirmed</text><text x="14" y="56" fill="#475569" font-size="11">by search_ibm_catalog results.&quot;</text><text x="14" y="74" fill="#475569" font-size="11">→ no hallucinated IBM service names.</text><text x="14" y="90" fill="#475569" font-size="11">Catalog is the oracle for what exists.</text></g><g transform="translate(790, 46)"><rect width="365" height="100" fill="#ecfdf5" rx="10"/><text x="14" y="22" fill="#065f46" font-size="11.5" font-weight="700">Same LangChain interface</text><text x="14" y="40" fill="#475569" font-size="11">Inline tool: function with @tool decorator.</text><text x="14" y="56" fill="#475569" font-size="11">MCP tool: StructuredTool from bridge.</text><text x="14" y="74" fill="#475569" font-size="11">→ CugaAgent treats them identically.</text><text x="14" y="90" fill="#475569" font-size="11">[search_ibm_catalog, *web_tools] just works.</text></g><g transform="translate(1175, 46)"><rect width="345" height="100" fill="#fffbeb" rx="10"/><text x="14" y="22" fill="#78350f" font-size="11.5" font-weight="700">Output structure from prompt</text><text x="14" y="40" fill="#475569" font-size="11">Architecture name → services list →</text><text x="14" y="56" fill="#475569" font-size="11">connection diagram → ibmcloud CLI →</text><text x="14" y="74" fill="#475569" font-size="11">cost note. Format dictated, not LLM whim.</text><text x="14" y="90" fill="#475569" font-size="11">UI renders cleanly because it&apos;s predictable.</text></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1600 1080"><defs><filter id="shadow" width="104%" height="108%" x="-2%" y="-2%"><feDropShadow dx="0" dy="2" flood-opacity=".08" stdDeviation="3"/></filter><marker id="arrowDown" markerHeight="6" markerWidth="6" orient="auto" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrowDownIndigo" markerHeight="6" markerWidth="6" orient="auto" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#6366f1" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrowDownTeal" markerHeight="6" markerWidth="6" orient="auto" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#0ea5e9" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1600" height="1080" fill="#fafbfc"/><text x="800" y="42" fill="#0f172a" font-size="30" font-weight="700" text-anchor="middle">cuga-apps — System Architecture</text><text x="800" y="72" fill="#64748b" font-size="15" text-anchor="middle">24 agent apps · 8 MCP servers · one shared tool fabric · one umbrella UI</text><g filter="url(#shadow)" transform="translate(40, 100)"><rect width="1520" height="70" fill="#fff" stroke="#e2e8f0" rx="12"/><text x="20" y="28" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".08em">CROSS-CUTTING INFRA</text><g transform="translate(190, 16)"><rect width="290" height="42" fill="#f1f5f9" stroke="#cbd5e1" rx="8"/><text x="14" y="18" fill="#475569" font-size="11" font-weight="700">apps/_ports.py</text><text x="14" y="33" fill="#64748b" font-size="11">single source of truth for every port</text></g><g transform="translate(490, 16)"><rect width="290" height="42" fill="#f1f5f9" stroke="#cbd5e1" rx="8"/><text x="14" y="18" fill="#475569" font-size="11" font-weight="700">apps/_llm.py</text><text x="14" y="33" fill="#64748b" font-size="11">multi-provider: rits · anthropic · openai · watsonx · ollama · litellm</text></g><g transform="translate(790, 16)"><rect width="320" height="42" fill="#f1f5f9" stroke="#cbd5e1" rx="8"/><text x="14" y="18" fill="#475569" font-size="11" font-weight="700">tests/ — 120 integration tests</text><text x="14" y="33" fill="#64748b" font-size="11">smoke · mcp · wiring · llm (~13s default, $0)</text></g><g transform="translate(1120, 16)"><rect width="380" height="42" fill="#f1f5f9" stroke="#cbd5e1" rx="8"/><text x="14" y="18" fill="#475569" font-size="11" font-weight="700">Docker — Dockerfile.mcp + Dockerfile.apps</text><text x="14" y="33" fill="#64748b" font-size="11">one MCP image · 8 entrypoints · one apps image hosting all 24</text></g></g><g filter="url(#shadow)" transform="translate(620, 200)"><rect width="360" height="58" fill="#0f172a" rx="29"/><text x="180" y="28" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">User browser</text><text x="180" y="46" fill="#cbd5e1" font-size="11.5" text-anchor="middle">prompts · clicks · views agent output</text></g><line x1="800" x2="800" y1="262" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDown)"/><g><text x="20" y="20" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".08em" transform="translate(40, 295)">LAYER 1 · USER INTERFACE</text></g><g filter="url(#shadow)" transform="translate(420, 320)"><rect width="350" height="80" fill="#fff" stroke="#6366f1" stroke-width="1.5" rx="12"/><text x="20" y="26" fill="#1e1b4b" font-size="14" font-weight="700">Umbrella UI</text><text x="20" y="48" fill="#475569" font-size="12">React + Vite · nginx</text><rect width="60" height="18" x="20" y="56" fill="#eef2ff" rx="9"/><text x="50" y="69" fill="#4338ca" font-size="11" font-weight="700" text-anchor="middle">:3001</text><text x="90" y="69" fill="#64748b" font-size="11">tile per app · MCP-usage chips</text></g><g filter="url(#shadow)" transform="translate(830, 320)"><rect width="350" height="80" fill="#fff" stroke="#6366f1" stroke-width="1.5" rx="12"/><text x="20" y="26" fill="#1e1b4b" font-size="14" font-weight="700">MCP Tool Explorer</text><text x="20" y="48" fill="#475569" font-size="12">browse + invoke any MCP tool</text><rect width="60" height="18" x="20" y="56" fill="#eef2ff" rx="9"/><text x="50" y="69" fill="#4338ca" font-size="11" font-weight="700" text-anchor="middle">:28900</text><text x="90" y="69" fill="#64748b" font-size="11">forms from input schemas</text></g><line x1="595" x2="595" y1="404" y2="438" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDown)"/><line x1="1005" x2="1005" y1="404" y2="438" stroke="#64748b" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#arrowDown)"/><g><text x="20" y="20" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".08em" transform="translate(40, 444)">LAYER 2 · AGENT APPS (24)</text></g><g filter="url(#shadow)" transform="translate(40, 469)"><rect width="1520" height="120" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1" rx="14"/><text x="24" y="30" fill="#1e1b4b" font-size="14" font-weight="700">24 FastAPI agent apps · each = CugaAgent + ui.py · ports 28071–28815</text><g transform="translate(24, 50)"><rect width="180" height="28" fill="#fff" stroke="#6366f1" stroke-width="1.2" rx="14"/><text x="90" y="19" fill="#1e1b4b" font-size="11.5" font-weight="600" text-anchor="middle">Research &amp; Knowledge · 7</text></g><g transform="translate(214, 50)"><rect width="160" height="28" fill="#fff" stroke="#10b981" stroke-width="1.2" rx="14"/><text x="80" y="19" fill="#064e3b" font-size="11.5" font-weight="600" text-anchor="middle">Content Creation · 4</text></g><g transform="translate(384, 50)"><rect width="180" height="28" fill="#fff" stroke="#f59e0b" stroke-width="1.2" rx="14"/><text x="90" y="19" fill="#78350f" font-size="11.5" font-weight="600" text-anchor="middle">Documents &amp; Media · 4</text></g><g transform="translate(574, 50)"><rect width="135" height="28" fill="#fff" stroke="#ec4899" stroke-width="1.2" rx="14"/><text x="67.5" y="19" fill="#831843" font-size="11.5" font-weight="600" text-anchor="middle">Productivity · 2</text></g><g transform="translate(719, 50)"><rect width="135" height="28" fill="#fff" stroke="#06b6d4" stroke-width="1.2" rx="14"/><text x="67.5" y="19" fill="#164e63" font-size="11.5" font-weight="600" text-anchor="middle">Ops &amp; Alerts · 2</text></g><g transform="translate(864, 50)"><rect width="160" height="28" fill="#fff" stroke="#8b5cf6" stroke-width="1.2" rx="14"/><text x="80" y="19" fill="#3b0764" font-size="11.5" font-weight="600" text-anchor="middle">Developer &amp; Eval · 2</text></g><g transform="translate(1034, 50)"><rect width="120" height="28" fill="#fff" stroke="#475569" stroke-width="1.2" rx="14"/><text x="60" y="19" fill="#0f172a" font-size="11.5" font-weight="600" text-anchor="middle">IBM Stack · 3</text></g><text x="24" y="103" fill="#475569" font-size="11.5"><tspan fill="#312e81" font-weight="700">Per-app pattern →</tspan> FastAPI shell · POST /ask · GET / (HTML) · CugaAgent(model=create_llm, tools=load_tools([...]), special_instructions=_SYSTEM)</text></g><line x1="800" x2="800" y1="591" y2="618" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowDownIndigo)"/><text x="815" y="610" fill="#4338ca" font-size="11" font-style="italic">load_tools([&quot;web&quot;, &quot;knowledge&quot;, ...])</text><g><text x="20" y="20" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".08em" transform="translate(40, 624)">LAYER 3 · ADAPTER / BRIDGE</text></g><g filter="url(#shadow)" transform="translate(280, 650)"><rect width="1040" height="62" fill="#312e81" rx="12"/><text x="24" y="26" fill="#fff" font-size="14" font-weight="700">apps/_mcp_bridge.py — LangChain ↔ MCP adapter</text><text x="24" y="48" fill="#c7d2fe" font-size="12">Apps call <tspan fill="#fde68a" font-family="monospace">load_tools([servers])</tspan> · returns LangChain StructuredTools that round-trip via streamable HTTP. Non-LLM <tspan fill="#fde68a" font-family="monospace">call_tool()</tspan> path for schedulers / watchers.</text></g><line x1="800" x2="800" y1="714" y2="742" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowDownTeal)"/><text x="815" y="734" fill="#0c4a6e" font-size="11" font-style="italic">streamable HTTP · MCP protocol</text><g><text x="20" y="20" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".08em" transform="translate(40, 748)">LAYER 4 · MCP FABRIC (8 servers · ports 29100–29107 · 36+ tools)</text></g><g filter="url(#shadow)" transform="translate(40, 776)"><rect width="1520" height="120" fill="#ecfeff" stroke="#7dd3fc" stroke-width="1" rx="14"/><g transform="translate(20, 16)"><rect width="180" height="88" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><rect width="180" height="26" fill="#0ea5e9" rx="10"/><rect width="180" height="10" y="16" fill="#0ea5e9"/><text x="90" y="18" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">mcp-web · 29100</text><text x="90" y="46" fill="#0c4a6e" font-size="10" text-anchor="middle">web_search, fetch_webpage,</text><text x="90" y="60" fill="#0c4a6e" font-size="10" text-anchor="middle">feeds, youtube transcripts</text><rect width="100" height="14" x="40" y="68" fill="#e0f2fe" rx="7"/><text x="90" y="78" fill="#0c4a6e" font-size="9" font-weight="700" text-anchor="middle">7 tools</text></g><g transform="translate(210, 16)"><rect width="180" height="88" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><rect width="180" height="26" fill="#0ea5e9" rx="10"/><rect width="180" height="10" y="16" fill="#0ea5e9"/><text x="90" y="18" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">mcp-knowledge · 29101</text><text x="90" y="46" fill="#0c4a6e" font-size="10" text-anchor="middle">Wikipedia, arXiv,</text><text x="90" y="60" fill="#0c4a6e" font-size="10" text-anchor="middle">Semantic Scholar</text><rect width="100" height="14" x="40" y="68" fill="#e0f2fe" rx="7"/><text x="90" y="78" fill="#0c4a6e" font-size="9" font-weight="700" text-anchor="middle">9 tools</text></g><g transform="translate(400, 16)"><rect width="180" height="88" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><rect width="180" height="26" fill="#0ea5e9" rx="10"/><rect width="180" height="10" y="16" fill="#0ea5e9"/><text x="90" y="18" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">mcp-geo · 29102</text><text x="90" y="46" fill="#0c4a6e" font-size="10" text-anchor="middle">Nominatim, Overpass,</text><text x="90" y="60" fill="#0c4a6e" font-size="10" text-anchor="middle">OpenTripMap, wttr.in</text><rect width="100" height="14" x="40" y="68" fill="#e0f2fe" rx="7"/><text x="90" y="78" fill="#0c4a6e" font-size="9" font-weight="700" text-anchor="middle">4 tools</text></g><g transform="translate(590, 16)"><rect width="180" height="88" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><rect width="180" height="26" fill="#0ea5e9" rx="10"/><rect width="180" height="10" y="16" fill="#0ea5e9"/><text x="90" y="18" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">mcp-finance · 29103</text><text x="90" y="46" fill="#0c4a6e" font-size="10" text-anchor="middle">CoinGecko,</text><text x="90" y="60" fill="#0c4a6e" font-size="10" text-anchor="middle">Alpha Vantage</text><rect width="100" height="14" x="40" y="68" fill="#e0f2fe" rx="7"/><text x="90" y="78" fill="#0c4a6e" font-size="9" font-weight="700" text-anchor="middle">2 tools</text></g><g transform="translate(780, 16)"><rect width="180" height="88" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><rect width="180" height="26" fill="#0ea5e9" rx="10"/><rect width="180" height="10" y="16" fill="#0ea5e9"/><text x="90" y="18" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">mcp-code · 29104</text><text x="90" y="46" fill="#0c4a6e" font-size="10" text-anchor="middle">Python AST,</text><text x="90" y="60" fill="#0c4a6e" font-size="10" text-anchor="middle">code metrics, lang-id</text><rect width="100" height="14" x="40" y="68" fill="#e0f2fe" rx="7"/><text x="90" y="78" fill="#0c4a6e" font-size="9" font-weight="700" text-anchor="middle">3 tools</text></g><g transform="translate(970, 16)"><rect width="180" height="88" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><rect width="180" height="26" fill="#0ea5e9" rx="10"/><rect width="180" height="10" y="16" fill="#0ea5e9"/><text x="90" y="18" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">mcp-local · 29105</text><text x="90" y="46" fill="#0c4a6e" font-size="10" text-anchor="middle">psutil, faster-whisper,</text><text x="90" y="60" fill="#0c4a6e" font-size="10" text-anchor="middle">disk + service status</text><rect width="100" height="14" x="40" y="68" fill="#e0f2fe" rx="7"/><text x="90" y="78" fill="#0c4a6e" font-size="9" font-weight="700" text-anchor="middle">7 tools</text></g><g transform="translate(1160, 16)"><rect width="180" height="88" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><rect width="180" height="26" fill="#0ea5e9" rx="10"/><rect width="180" height="10" y="16" fill="#0ea5e9"/><text x="90" y="18" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">mcp-text · 29106</text><text x="90" y="46" fill="#0c4a6e" font-size="10" text-anchor="middle">docling, tiktoken,</text><text x="90" y="60" fill="#0c4a6e" font-size="10" text-anchor="middle">recursive chunking</text><rect width="100" height="14" x="40" y="68" fill="#e0f2fe" rx="7"/><text x="90" y="78" fill="#0c4a6e" font-size="9" font-weight="700" text-anchor="middle">4 tools</text></g><g transform="translate(1350, 16)"><rect width="150" height="88" fill="#fff" stroke="#8b5cf6" stroke-width="1.5" rx="10"/><rect width="150" height="26" fill="#8b5cf6" rx="10"/><rect width="150" height="10" y="16" fill="#8b5cf6"/><text x="75" y="18" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">★ mcp-invocable_apis</text><text x="75" y="34" fill="#3b0764" font-size="10" text-anchor="middle">29107</text><text x="75" y="52" fill="#3b0764" font-size="9.5" text-anchor="middle">Bird-SQL synthesis</text><text x="75" y="66" fill="#3b0764" font-size="9.5" text-anchor="middle">tool_register, seq_*,</text><text x="75" y="78" fill="#3b0764" font-size="9.5" text-anchor="middle">dataset_emit</text></g></g><line x1="800" x2="800" y1="898" y2="924" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDown)"/><text x="815" y="918" fill="#475569" font-size="11" font-style="italic">httpx · {ok, data} envelopes</text><g><text x="20" y="20" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".08em" transform="translate(40, 930)">LAYER 5 · EXTERNAL DATA SOURCES + LOCAL PRIMITIVES</text></g><g filter="url(#shadow)" transform="translate(40, 957)"><rect width="1520" height="80" fill="#fff" stroke="#cbd5e1" rx="14"/><text x="24" y="28" fill="#0f172a" font-size="13" font-weight="700">External APIs / local resources hit by the MCP layer</text><text x="24" y="50" fill="#475569" font-size="11.5">Tavily · arXiv · Semantic Scholar · Wikipedia REST · OpenStreetMap (Nominatim, Overpass) · OpenTripMap · wttr.in · CoinGecko · Alpha Vantage · YouTube oEmbed/transcripts</text><text x="24" y="68" fill="#475569" font-size="11.5">psutil (host) · faster-whisper (Whisper) · docling (PDF/DOCX) · tiktoken (BPE) · ChromaDB (in-app) · SQLite (per-app + invocable_apis registry) · Bird-SQL DBs</text></g><text x="800" y="1064" fill="#64748b" font-size="11.5" text-anchor="middle">Each layer talks to the next over HTTP only — no in-process imports across the apps↔MCP boundary. Same protocol everywhere = uniform tests, uniform tool explorer.</text></svg>
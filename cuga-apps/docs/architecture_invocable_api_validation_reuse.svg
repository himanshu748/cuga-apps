<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1600 1080"><defs><filter id="shadow" width="104%" height="108%" x="-2%" y="-2%"><feDropShadow dx="0" dy="2" flood-opacity=".08" stdDeviation="3"/></filter><marker id="arrowDown" markerHeight="7" markerWidth="7" orient="auto" refX="5" refY="9" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrowR" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrowGreen" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#10b981" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1600" height="1080" fill="#fafbfc"/><text x="800" y="42" fill="#0f172a" font-size="28" font-weight="700" text-anchor="middle">Invocable API · why it scales</text><text x="800" y="70" fill="#64748b" font-size="14" text-anchor="middle">Closed-loop validation (top) + the reuse moat (bottom) · worked through qid 28 and qid 47</text><g transform="translate(40, 100)"><rect width="1520" height="36" fill="#f59e0b" rx="6"/><text x="14" y="24" fill="#fff" font-size="13" font-weight="700">A. INSIDE seq_validate(qid=28) · the closed-loop oracle that gates every emitted record</text></g><g><text x="0" y="14" fill="#0c4a6e" font-size="11" font-weight="700" letter-spacing=".08em" transform="translate(60, 156)">PATH 1 · ORACLE</text></g><g filter="url(#shadow)" transform="translate(60, 176)"><rect width="700" height="64" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><text x="20" y="24" fill="#0c4a6e" font-size="12" font-weight="700">Step 1 · load gold SQL from Bird</text><rect width="660" height="22" x="20" y="32" fill="#0f172a" rx="5"/><text x="28" y="46" fill="#cbd5e1" font-family="monospace" font-size="10">SELECT T2.School, T2.DOC FROM frpm T1 INNER JOIN schools T2 ... WHERE FundingType=&apos;Locally funded&apos; AND ...</text></g><line x1="410" x2="410" y1="240" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/><g filter="url(#shadow)" transform="translate(60, 268)"><rect width="700" height="64" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><text x="20" y="24" fill="#0c4a6e" font-size="12" font-weight="700">Step 2 · execute on real SQLite (mode=ro)</text><text x="20" y="44" fill="#475569" font-family="monospace" font-size="11">_rows_to_payload(con.execute(q[&quot;SQL&quot;]))</text><text x="20" y="58" fill="#475569" font-size="11">→ <tspan fill="#0c4a6e" font-weight="700">gold_rows = 57 tuples of (School, DOC)</tspan></text></g><line x1="410" x2="410" y1="332" y2="358" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/><g filter="url(#shadow)" transform="translate(60, 360)"><rect width="700" height="50" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.5" rx="10"/><text x="20" y="22" fill="#0c4a6e" font-size="12" font-weight="700">Step 3 · normalize</text><text x="20" y="40" fill="#475569" font-family="monospace" font-size="11">_normalize_for_compare(gold_rows) → list[tuple] · floats round to 6dp · sort within rows · sort row-list</text></g><g><text x="0" y="14" fill="#78350f" font-size="11" font-weight="700" letter-spacing=".08em" transform="translate(840, 156)">PATH 2 · RECORDED SEQUENCE</text></g><g filter="url(#shadow)" transform="translate(840, 176)"><rect width="700" height="64" fill="#fff" stroke="#f59e0b" stroke-width="1.5" rx="10"/><text x="20" y="24" fill="#78350f" font-size="12" font-weight="700">Step 1 · load sequence from sequences table</text><text x="20" y="44" fill="#475569" font-family="monospace" font-size="11">[{tool:&quot;avg_…&quot;,args:{funding_type:&quot;Locally funded&quot;},bind:&quot;avg&quot;},</text><text x="20" y="58" fill="#475569" font-family="monospace" font-size="11">{tool:&quot;schools_…&quot;,args:{funding_type:&quot;Locally funded&quot;,threshold:&quot;{{avg.avg_difference}}&quot;}}]</text></g><line x1="1190" x2="1190" y1="240" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/><g filter="url(#shadow)" transform="translate(840, 268)"><rect width="700" height="64" fill="#fff" stroke="#f59e0b" stroke-width="1.5" rx="10"/><text x="20" y="22" fill="#78350f" font-size="12" font-weight="700">Step 2 · _run_sequence with {{var}} binding</text><text x="20" y="40" fill="#475569" font-size="11">A. exec step 1 → <tspan font-family="monospace">{avg_difference: 16.7}</tspan> · bind to <tspan fill="#78350f" font-family="monospace" font-weight="700">avg</tspan></text><text x="20" y="56" fill="#475569" font-size="11">B. resolve <tspan font-family="monospace">{{avg.avg_difference}}</tspan> → 16.7 · exec step 2 → <tspan fill="#78350f" font-weight="700">57 rows</tspan></text></g><line x1="1190" x2="1190" y1="332" y2="358" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/><g filter="url(#shadow)" transform="translate(840, 360)"><rect width="700" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="10"/><text x="20" y="22" fill="#78350f" font-size="12" font-weight="700">Step 3 · normalize</text><text x="20" y="40" fill="#475569" font-family="monospace" font-size="11">_normalize_for_compare(final_rows) · same coercion handles dict-of-list-of-dicts vs SQL tuples</text></g><line x1="410" x2="700" y1="412" y2="442" stroke="#475569" stroke-width="1.5"/><line x1="1190" x2="900" y1="412" y2="442" stroke="#475569" stroke-width="1.5"/><g filter="url(#shadow)" transform="translate(560, 444)"><rect width="480" height="78" fill="#312e81" rx="12"/><text x="240" y="26" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">SET-EQUALITY · normalized_gold == normalized_final</text><text x="240" y="48" fill="#c7d2fe" font-size="11" text-anchor="middle">handles row order, float tolerance, column-order mismatches</text><rect width="120" height="16" x="180" y="56" fill="#fbbf24" rx="8"/><text x="240" y="68" fill="#78350f" font-size="11" font-weight="700" text-anchor="middle">passed: true</text></g><line x1="800" x2="800" y1="524" y2="546" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDown)"/><g filter="url(#shadow)" transform="translate(60, 548)"><rect width="1480" height="58" fill="#fff" stroke="#cbd5e1" rx="10"/><text x="20" y="24" fill="#0f172a" font-size="12" font-weight="700">Step 4 · persist outcome to <tspan fill="#475569" font-family="monospace">validations</tspan> table · emit on dataset_emit</text><text x="20" y="46" fill="#475569" font-family="monospace" font-size="11">INSERT OR REPLACE INTO validations (question_id, passed, final_result, gold_result, failure_msg, validated_at) → <tspan fill="#10b981" font-weight="700">dataset.json[28].validated = true</tspan></text></g><g transform="translate(60, 624)"><rect width="1480" height="36" fill="#fef2f2" stroke="#fecaca" rx="8"/><text x="20" y="22" fill="#991b1b" font-size="11.5">If <tspan font-weight="700">passed = false</tspan> → <tspan font-family="monospace">failure_msg = &quot;result mismatch — gold=[...] final=[...]&quot;</tspan> · agent reads this, fixes a tool (re-register), runs seq_validate again. Up to 2 retries.</text></g><g transform="translate(40, 690)"><rect width="1520" height="36" fill="#10b981" rx="6"/><text x="14" y="24" fill="#fff" font-size="13" font-weight="700">B. THE REUSE MOAT · why the API surface shrinks as the batch progresses</text></g><g filter="url(#shadow)" transform="translate(40, 746)"><rect width="490" height="306" fill="#fff" stroke="#cbd5e1" rx="14"/><rect width="490" height="38" fill="#1e293b" rx="14"/><rect width="490" height="12" y="26" fill="#1e293b"/><text x="20" y="26" fill="#fff" font-size="13" font-weight="700">After qid 28 · registry state</text><text x="20" y="62" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".06em">2 TOOLS REGISTERED</text><g transform="translate(20, 74)"><rect width="450" height="78" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" rx="8"/><text x="14" y="20" fill="#3b0764" font-family="monospace" font-size="12" font-weight="700">avg_enrollment_difference_by_funding_type</text><text x="14" y="38" fill="#475569" font-size="10.5">params: funding_type: str (slot examples: Directly funded, …)</text><text x="14" y="54" fill="#475569" font-size="10.5">desc: AVG of (Enrollment K-12 − Enrollment Ages 5-17)</text><text x="14" y="70" fill="#475569" font-size="10.5">filtered by FundingType.</text></g><g transform="translate(20, 162)"><rect width="450" height="78" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" rx="8"/><text x="14" y="20" fill="#3b0764" font-family="monospace" font-size="12" font-weight="700">schools_with_enrollment_difference_above_funding</text><text x="14" y="38" fill="#475569" font-size="10.5">params: funding_type: str, threshold: float</text><text x="14" y="54" fill="#475569" font-size="10.5">desc: schools whose K-12 − 5-17 enrollment exceeds</text><text x="14" y="70" fill="#475569" font-size="10.5">a threshold, filtered by FundingType.</text></g><text x="20" y="262" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".06em">SEQUENCES TABLE</text><text x="20" y="280" fill="#475569" font-size="11.5">qid 28 → 2-step sequence · validated · passed=true</text><text x="20" y="296" fill="#64748b" font-size="11" font-style="italic">Both tools parametric — the slot funding_type lifts the question&apos;s literal.</text></g><line x1="540" x2="568" y1="900" y2="900" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/><text x="554" y="888" fill="#065f46" font-size="10" font-style="italic" text-anchor="middle">later</text><g filter="url(#shadow)" transform="translate(575, 746)"><rect width="490" height="306" fill="#fff" stroke="#cbd5e1" rx="14"/><rect width="490" height="38" fill="#10b981" rx="14"/><rect width="490" height="12" y="26" fill="#10b981"/><text x="20" y="26" fill="#fff" font-size="13" font-weight="700">qid 47 · reuses what&apos;s there</text><text x="20" y="62" fill="#475569" font-size="11" font-style="italic">&quot;What&apos;s the average enrollment difference for directly-funded schools?&quot;</text><text x="20" y="92" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing=".06em">AGENT&apos;S DECISION</text><g transform="translate(20, 104)"><rect width="450" height="32" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1" rx="6"/><text x="14" y="20" fill="#0c4a6e" font-family="monospace" font-size="11"><tspan font-weight="700">tool_list(db)</tspan> → finds avg_enrollment_difference_by_funding_type</text></g><g transform="translate(20, 144)"><rect width="450" height="46" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="6"/><text x="14" y="18" fill="#065f46" font-family="monospace" font-size="11"><tspan font-weight="700">tool_call</tspan>(name=&quot;avg_enrollment_difference_by_funding_type&quot;,</text><text x="14" y="34" fill="#065f46" font-family="monospace" font-size="11">args={funding_type: <tspan fill="#dc2626" font-weight="700">&quot;Directly funded&quot;</tspan>})</text></g><g transform="translate(20, 198)"><rect width="450" height="32" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="6"/><text x="14" y="20" fill="#78350f" font-family="monospace" font-size="11"><tspan font-weight="700">seq_record</tspan> + <tspan font-weight="700">seq_validate</tspan> → passed=true · no new tool</text></g><g transform="translate(20, 240)"><rect width="450" height="50" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" rx="8"/><text x="14" y="20" fill="#065f46" font-size="11" font-weight="700">Net effect on registry: +0 tools · +1 question covered</text><text x="14" y="40" fill="#475569" font-size="10.5" font-style="italic">tool_usage.json: avg_enrollment_difference_by_funding_type.used_by_question_ids = [28, 47]</text></g></g><g filter="url(#shadow)" transform="translate(1110, 746)"><rect width="450" height="306" fill="#fff" stroke="#cbd5e1" rx="14"/><rect width="450" height="38" fill="#1e293b" rx="14"/><rect width="450" height="12" y="26" fill="#1e293b"/><text x="20" y="26" fill="#fff" font-size="13" font-weight="700">API surface vs. questions covered</text><line x1="60" x2="420" y1="240" y2="240" stroke="#cbd5e1" stroke-width="1.5"/><line x1="60" x2="60" y1="60" y2="240" stroke="#cbd5e1" stroke-width="1.5"/><line x1="60" x2="420" y1="240" y2="70" stroke="#dc2626" stroke-dasharray="4 3" stroke-width="2.5"/><text x="372" y="64" fill="#dc2626" font-size="11" font-weight="700">naive: 89 unique tools</text><path fill="none" stroke="#10b981" stroke-width="2.5" d="M 60 240 Q 180 130 280 110 T 420 100"/><text x="290" y="148" fill="#065f46" font-size="11" font-weight="700">with reuse: ~25-30 tools</text><text x="290" y="162" fill="#10b981" font-size="10">across all 89 questions</text><circle cx="60" cy="240" r="4" fill="#10b981"/><text x="48" y="258" fill="#475569" font-size="10">qid 0</text><circle cx="155" cy="160" r="4" fill="#10b981"/><text x="138" y="178" fill="#475569" font-size="10">qid 28</text><circle cx="190" cy="142" r="4" fill="#10b981"/><text x="172" y="132" fill="#475569" font-size="10">qid 47</text><text x="174" y="120" fill="#10b981" font-size="9" font-style="italic" font-weight="700">(no growth)</text><text x="240" y="262" fill="#94a3b8" font-size="10" text-anchor="middle">questions processed →</text><text x="40" y="150" fill="#94a3b8" font-size="10" transform="rotate(-90, 40, 150)">tools registered →</text><text x="20" y="290" fill="#475569" font-size="11" font-style="italic">The &quot;tools reused across questions&quot; tile is the meta-moat metric.</text></g></svg>
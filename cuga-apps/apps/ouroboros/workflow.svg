<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1640" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" viewBox="0 0 1280 1640"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8b949e" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrowAccent" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#58a6ff" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrowLoop" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#a78bfa" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1280" height="1640" fill="#0d1117"/><text x="640" y="48" fill="#e6edf3" font-size="24" font-weight="700" text-anchor="middle">Ouroboros — workflow</text><text x="640" y="74" fill="#8b949e" font-size="13" text-anchor="middle">A user request OR a loop fire enters the same `_handle_full_turn` and runs the 3-phase cascade.</text><g><rect width="500" height="92" x="80" y="120" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="10"/><text x="100" y="148" fill="#58a6ff" font-size="13" font-weight="700">👤 Browser — user request</text><text x="100" y="172" fill="#8b949e" font-size="12">User types a question, optionally clicks 🔁 Schedule</text><text x="100" y="190" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="11">POST /ask {question, thread_id}</text></g><g><rect width="500" height="92" x="700" y="120" fill="#161b22" stroke="#a78bfa" stroke-dasharray="4 3" stroke-width="1.5" rx="10"/><text x="720" y="148" fill="#a78bfa" font-size="13" font-weight="700">🔁 CUGA Loops scheduler — loop fire</text><text x="720" y="172" fill="#8b949e" font-size="12">APScheduler tick · fires registered _loop_invoke</text><text x="720" y="190" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="11">runner.fire_loop(loop_id) → _loop_invoke(prompt, thread_id)</text></g><line x1="330" x2="500" y1="212" y2="278" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="950" x2="780" y1="212" y2="278" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowLoop)"/><g><rect width="640" height="92" x="320" y="280" fill="#1a2332" stroke="#58a6ff" stroke-width="2" rx="10"/><text x="640" y="308" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">_handle_full_turn(question, thread_id, source, loop_id)</text><text x="640" y="330" fill="#8b949e" font-size="12" text-anchor="middle">Single entry point — both paths converge here. Stamps `source = &apos;user&apos; | &apos;loop&apos;` on every saved run.</text><text x="640" y="354" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">augmented = _TASK_PRELUDE + question + session_brief + thread_tag</text></g><line x1="640" x2="640" y1="372" y2="430" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowAccent)"/><g><rect width="1040" height="68" x="120" y="430" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="10"/><text x="640" y="458" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">await supervisor.invoke(augmented, thread_id=thread_id)</text><text x="640" y="480" fill="#8b949e" font-size="11" text-anchor="middle">CugaSupervisor (RITS gpt-oss-120b, 100-step cap, enable_loops=True). Planner reasons in `delegate_to_&lt;X&gt;` calls.</text></g><line x1="640" x2="640" y1="498" y2="540" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="1040" height="120" x="120" y="540" fill="#0f1820" stroke="#58a6ff" stroke-width="1.5" rx="10"/><text x="148" y="568" fill="#58a6ff" font-size="13" font-weight="700">PHASE 1 · scout — geographic recon</text><text x="148" y="590" fill="#e6edf3" font-size="12">scout_result = await delegate_to_scout(task=user_question)</text><text x="148" y="610" fill="#8b949e" font-family="ui-monospace,monospace" font-size="11">geocode(place) → Nominatim · find_local_businesses(lat, lon, category) → Overpass / OSM</text><text x="148" y="634" fill="#e6edf3" font-size="12">↓ candidates = [...] top = candidates[:3] enrichments = {i: {&quot;candidate&quot;: c} for i, c in enumerate(top)}</text></g><line x1="640" x2="640" y1="660" y2="700" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="1040" height="280" x="120" y="700" fill="#0f1820" stroke="#facc15" stroke-width="1.5" rx="10"/><text x="148" y="728" fill="#facc15" font-size="13" font-weight="700">PHASE 2 · five sweeps over the top 3 candidates</text><text x="148" y="750" fill="#8b949e" font-size="12">Each sweep WRITES into enrichments[i][&lt;key&gt;] for every candidate. Skipped candidates store &quot;&quot; so the slot exists.</text><g transform="translate(160,772)"><text x="200" y="14" fill="#8b949e" font-size="10" text-anchor="middle">candidate 0</text><text x="430" y="14" fill="#8b949e" font-size="10" text-anchor="middle">candidate 1</text><text x="660" y="14" fill="#8b949e" font-size="10" text-anchor="middle">candidate 2</text><rect width="160" height="32" x="0" y="22" fill="#1a1530" stroke="#a78bfa" stroke-width="1" rx="6"/><text x="80" y="42" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">voice_of_customer</text><rect width="60" height="32" x="170" y="22" fill="#161b22" stroke="#30363d" rx="4"/><text x="200" y="42" fill="#a78bfa" font-size="10" text-anchor="middle">voc</text><rect width="60" height="32" x="400" y="22" fill="#161b22" stroke="#30363d" rx="4"/><text x="430" y="42" fill="#a78bfa" font-size="10" text-anchor="middle">voc</text><rect width="60" height="32" x="630" y="22" fill="#161b22" stroke="#30363d" rx="4"/><text x="660" y="42" fill="#a78bfa" font-size="10" text-anchor="middle">voc</text><text x="700" y="42" fill="#8b949e" font-size="11">→ Tavily reviews search</text><rect width="160" height="32" x="0" y="62" fill="#0f2030" stroke="#3fb950" stroke-width="1" rx="6"/><text x="80" y="82" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">site_auditor</text><rect width="60" height="32" x="170" y="62" fill="#161b22" stroke="#30363d" rx="4"/><text x="200" y="82" fill="#3fb950" font-size="10" text-anchor="middle">audit</text><rect width="60" height="32" x="400" y="62" fill="#161b22" stroke="#30363d" rx="4"/><text x="430" y="82" fill="#3fb950" font-size="10" text-anchor="middle">audit</text><rect width="60" height="32" x="630" y="62" fill="#161b22" stroke="#30363d" rx="4"/><text x="660" y="82" fill="#3fb950" font-size="10" text-anchor="middle">audit</text><text x="700" y="82" fill="#8b949e" font-size="11">→ httpx fetch + 17 signal checks</text><rect width="160" height="32" x="0" y="102" fill="#2d1530" stroke="#ec4899" stroke-width="1" rx="6"/><text x="80" y="122" fill="#ec4899" font-size="11" font-weight="700" text-anchor="middle">revenue_estimator</text><rect width="60" height="32" x="170" y="102" fill="#161b22" stroke="#30363d" rx="4"/><text x="200" y="122" fill="#ec4899" font-size="10" text-anchor="middle">revenue</text><rect width="60" height="32" x="400" y="102" fill="#161b22" stroke="#30363d" rx="4"/><text x="430" y="122" fill="#ec4899" font-size="10" text-anchor="middle">revenue</text><rect width="60" height="32" x="630" y="102" fill="#161b22" stroke="#30363d" rx="4"/><text x="660" y="122" fill="#ec4899" font-size="10" text-anchor="middle">revenue</text><text x="700" y="122" fill="#8b949e" font-size="11">→ size signals → coarse ARR band</text><rect width="160" height="32" x="0" y="142" fill="#2d2510" stroke="#facc15" stroke-width="1" rx="6"/><text x="80" y="162" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">person_finder</text><rect width="60" height="32" x="170" y="142" fill="#161b22" stroke="#30363d" rx="4"/><text x="200" y="162" fill="#facc15" font-size="10" text-anchor="middle">person</text><rect width="60" height="32" x="400" y="142" fill="#161b22" stroke="#30363d" rx="4"/><text x="430" y="162" fill="#facc15" font-size="10" text-anchor="middle">person</text><rect width="60" height="32" x="630" y="142" fill="#161b22" stroke="#30363d" rx="4"/><text x="660" y="162" fill="#facc15" font-size="10" text-anchor="middle">person</text><text x="700" y="162" fill="#8b949e" font-size="11">→ owner search + email pattern guess</text><rect width="160" height="32" x="0" y="182" fill="#0f2528" stroke="#14b8a6" stroke-width="1" rx="6"/><text x="80" y="202" fill="#14b8a6" font-size="11" font-weight="700" text-anchor="middle">stack_scanner</text><rect width="60" height="32" x="170" y="182" fill="#161b22" stroke="#30363d" rx="4"/><text x="200" y="202" fill="#14b8a6" font-size="10" text-anchor="middle">stack</text><rect width="60" height="32" x="400" y="182" fill="#161b22" stroke="#30363d" rx="4"/><text x="430" y="202" fill="#14b8a6" font-size="10" text-anchor="middle">stack</text><rect width="60" height="32" x="630" y="182" fill="#161b22" stroke="#30363d" rx="4"/><text x="660" y="202" fill="#14b8a6" font-size="10" text-anchor="middle">stack</text><text x="700" y="202" fill="#8b949e" font-size="11">→ regex fingerprint of 33 third-parties</text></g></g><line x1="640" x2="640" y1="980" y2="1020" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="1040" height="120" x="120" y="1020" fill="#0f1820" stroke="#3fb950" stroke-width="1.5" rx="10"/><text x="148" y="1048" fill="#3fb950" font-size="13" font-weight="700">PHASE 3 · pitch_email_writer — synthesis (no tools)</text><text x="148" y="1070" fill="#e6edf3" font-size="12">enriched_list = [enrichments[i] for i in range(len(top))]</text><text x="148" y="1090" fill="#e6edf3" font-size="12">final = await delegate_to_pitch_email_writer(task = &quot;Build the lead board…&quot; + json contexts)</text><text x="148" y="1114" fill="#8b949e" font-family="ui-monospace,monospace" font-size="11">→ fenced ```json``` { &quot;leads&quot;: [...] } + 2-paragraph summary (enforced by leads_board_formatter policy)</text></g><line x1="640" x2="640" y1="1140" y2="1180" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="1040" height="50" x="120" y="1180" fill="#1a2332" stroke="#58a6ff" stroke-width="1" rx="6"/><text x="640" y="1212" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">_extract_leads_json + _normalize_leads_obj — tolerant parser handles writer drift</text></g><line x1="640" x2="640" y1="1230" y2="1270" stroke="#8b949e" stroke-dasharray="4 3" stroke-width="1"/><g><rect width="280" height="160" x="80" y="1280" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="10"/><text x="220" y="1310" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">UI · Lead board</text><text x="220" y="1334" fill="#8b949e" font-size="11" text-anchor="middle">session[thread_id][&quot;leads&quot;]</text><text x="220" y="1352" fill="#e6edf3" font-size="11" text-anchor="middle">Right panel polls /session/...</text><text x="220" y="1372" fill="#e6edf3" font-size="11" text-anchor="middle">renders ranked leads + scores</text><text x="220" y="1392" fill="#e6edf3" font-size="11" text-anchor="middle">+ email-draft buttons</text><text x="220" y="1418" fill="#8b949e" font-size="10" text-anchor="middle">(both user runs + loop fires)</text></g><g><rect width="280" height="160" x="380" y="1280" fill="#161b22" stroke="#facc15" stroke-width="1.5" rx="10"/><text x="520" y="1310" fill="#facc15" font-size="13" font-weight="700" text-anchor="middle">Run history · disk</text><text x="520" y="1334" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">runs/&lt;thread&gt;/&lt;ts&gt;.json</text><text x="520" y="1356" fill="#8b949e" font-size="11" text-anchor="middle">_save_run() — full record:</text><text x="520" y="1374" fill="#e6edf3" font-size="10" text-anchor="middle">timestamp · question · leads</text><text x="520" y="1390" fill="#e6edf3" font-size="10" text-anchor="middle">agent_trace · supervisor_state</text><text x="520" y="1408" fill="#a78bfa" font-size="10" text-anchor="middle">source · loop_id</text><text x="520" y="1428" fill="#8b949e" font-size="10" text-anchor="middle">→ shows in Past runs drawer</text></g><g><rect width="280" height="160" x="680" y="1280" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="10"/><text x="820" y="1310" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">✉️ Email send</text><text x="820" y="1334" fill="#8b949e" font-size="11" text-anchor="middle">_maybe_send_email_for_run()</text><text x="820" y="1354" fill="#e6edf3" font-size="11" text-anchor="middle">asyncio.create_task → smtplib</text><text x="820" y="1374" fill="#e6edf3" font-size="11" text-anchor="middle">Subject prefix:</text><text x="820" y="1392" fill="#8b949e" font-size="10" text-anchor="middle">👤 USER REQUEST · …</text><text x="820" y="1408" fill="#a78bfa" font-size="10" text-anchor="middle">🔁 LOOP FIRE · …</text><text x="820" y="1428" fill="#8b949e" font-size="10" text-anchor="middle">Gate: recipient + SMTP creds</text></g><g><rect width="220" height="160" x="980" y="1280" fill="#161b22" stroke="#a78bfa" stroke-dasharray="4 3" stroke-width="1.5" rx="10"/><text x="1090" y="1310" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">🔁 Loop schedule</text><text x="1090" y="1330" fill="#8b949e" font-size="10" text-anchor="middle">(optional — only if</text><text x="1090" y="1346" fill="#8b949e" font-size="10" text-anchor="middle">user said &quot;watch every X&quot;)</text><text x="1090" y="1370" fill="#e6edf3" font-size="11" text-anchor="middle">supervisor calls</text><text x="1090" y="1388" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="10" text-anchor="middle">schedule_recurring(...)</text><text x="1090" y="1408" fill="#8b949e" font-size="10" text-anchor="middle">→ APScheduler arms job</text><text x="1090" y="1428" fill="#a78bfa" font-size="10" text-anchor="middle">→ next fire re-enters top</text></g><line x1="640" x2="220" y1="1270" y2="1280" stroke="#8b949e" stroke-dasharray="3 3" stroke-width="1"/><line x1="640" x2="520" y1="1270" y2="1280" stroke="#8b949e" stroke-dasharray="3 3" stroke-width="1"/><line x1="640" x2="820" y1="1270" y2="1280" stroke="#8b949e" stroke-dasharray="3 3" stroke-width="1"/><line x1="640" x2="1090" y1="1270" y2="1280" stroke="#a78bfa" stroke-dasharray="3 3" stroke-width="1"/><path fill="none" stroke="#a78bfa" stroke-dasharray="6 4" stroke-width="1.5" marker-end="url(#arrowLoop)" d="M 1200,1360 Q 1250,1360 1250,1100 Q 1250,180 950,180"/><text x="1255" y="700" fill="#a78bfa" font-size="10" text-anchor="middle" transform="rotate(-90 1255,700)">on next fire — re-enters as 🔁 loop</text><g transform="translate(80,1480)"><text x="0" y="0" fill="#8b949e" font-size="11" font-weight="700">LEGEND</text><rect width="14" height="12" x="0" y="10" fill="none" stroke="#58a6ff" stroke-width="1.5"/><text x="20" y="20" fill="#e6edf3" font-size="11">user-driven</text><rect width="14" height="12" x="120" y="10" fill="none" stroke="#a78bfa" stroke-dasharray="3 2" stroke-width="1.5"/><text x="140" y="20" fill="#e6edf3" font-size="11">loop-driven</text><rect width="14" height="12" x="240" y="10" fill="none" stroke="#facc15" stroke-width="1.5"/><text x="260" y="20" fill="#e6edf3" font-size="11">phase 2 — fan-out</text><rect width="14" height="12" x="400" y="10" fill="none" stroke="#3fb950" stroke-width="1.5"/><text x="420" y="20" fill="#e6edf3" font-size="11">synthesis / output</text><text x="0" y="50" fill="#8b949e" font-size="10">• Specialists run sequentially in the supervisor&apos;s planner code blocks (phase 2 = 5 sweeps × N candidates).</text><text x="0" y="68" fill="#8b949e" font-size="10">• `_handle_full_turn` is the single entry point — both POST /ask (source=&apos;user&apos;) and APScheduler fires (source=&apos;loop&apos;) hit it.</text><text x="0" y="86" fill="#8b949e" font-size="10">• Each fire re-enters the top of the diagram, so a recurring loop produces a new lead board + run + email per tick.</text></g><text x="640" y="1620" fill="#6b7280" font-size="10" text-anchor="middle">apps/ouroboros/workflow.svg · referenced from ARCHITECTURE.md</text></svg>
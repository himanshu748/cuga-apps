<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" viewBox="0 0 1440 1100"><defs><marker id="downArrow" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8b949e" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1440" height="1100" fill="#0d1117"/><text x="720" y="42" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Ouroboros — stack</text><text x="720" y="68" fill="#8b949e" font-size="12" text-anchor="middle">Layered view: each layer talks only to the next; storage is a side-cabinet that all layers read/write.</text><g><rect width="240" height="800" x="1170" y="100" fill="#161b22" stroke="#facc15" stroke-width="1.5" rx="12"/><text x="1290" y="128" fill="#facc15" font-size="13" font-weight="700" text-anchor="middle">📁 Storage (sidecar)</text><text x="1290" y="148" fill="#8b949e" font-size="10" text-anchor="middle">read/written by every layer</text><rect width="200" height="100" x="1190" y="170" fill="#0d1117" stroke="#30363d" rx="8"/><text x="1290" y="190" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">runs/&lt;thread&gt;/*.json</text><text x="1290" y="208" fill="#8b949e" font-size="10" text-anchor="middle">per-turn metadata</text><text x="1290" y="226" fill="#e6edf3" font-size="10" text-anchor="middle">timestamp · source</text><text x="1290" y="242" fill="#e6edf3" font-size="10" text-anchor="middle">loop_id · leads</text><text x="1290" y="260" fill="#e6edf3" font-size="10" text-anchor="middle">agent_trace · stages</text><rect width="200" height="80" x="1190" y="290" fill="#0d1117" stroke="#30363d" rx="8"/><text x="1290" y="310" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">.email_store.json</text><text x="1290" y="328" fill="#8b949e" font-size="10" text-anchor="middle">UI-editable</text><text x="1290" y="344" fill="#e6edf3" font-size="10" text-anchor="middle">recipient · SMTP creds</text><text x="1290" y="360" fill="#e6edf3" font-size="10" text-anchor="middle">per-source toggles</text><rect width="200" height="100" x="1190" y="390" fill="#0d1117" stroke="#a78bfa" rx="8"/><text x="1290" y="410" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">cuga_loops + cuga_loop_runs</text><text x="1290" y="428" fill="#8b949e" font-size="10" text-anchor="middle">SQLite (in SDK)</text><text x="1290" y="446" fill="#e6edf3" font-size="10" text-anchor="middle">loop spec · cadence</text><text x="1290" y="462" fill="#e6edf3" font-size="10" text-anchor="middle">next_fire · history</text><text x="1290" y="480" fill="#8b949e" font-size="10" text-anchor="middle">~/.cuga/dbs/cuga.db</text><rect width="200" height="80" x="1190" y="510" fill="#0d1117" stroke="#30363d" rx="8"/><text x="1290" y="530" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">policy store</text><text x="1290" y="548" fill="#8b949e" font-size="10" text-anchor="middle">SQLite-vec (in SDK)</text><text x="1290" y="564" fill="#e6edf3" font-size="10" text-anchor="middle">3 ouroboros policies</text><text x="1290" y="580" fill="#8b949e" font-size="10" text-anchor="middle">cleared on startup</text><rect width="200" height="100" x="1190" y="610" fill="#0d1117" stroke="#30363d" rx="8"/><text x="1290" y="630" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">skills/&lt;name&gt;/</text><text x="1290" y="648" fill="#8b949e" font-size="10" text-anchor="middle">declarative spec</text><text x="1290" y="664" fill="#e6edf3" font-size="10" text-anchor="middle">SKILL.md · tools.py</text><text x="1290" y="682" fill="#8b949e" font-size="10" text-anchor="middle">edit → restart</text><text x="1290" y="700" fill="#8b949e" font-size="10" text-anchor="middle">→ change live</text><rect width="200" height="80" x="1190" y="730" fill="#0d1117" stroke="#30363d" rx="8"/><text x="1290" y="750" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">_sessions[thread_id]</text><text x="1290" y="768" fill="#8b949e" font-size="10" text-anchor="middle">in-memory dict</text><text x="1290" y="784" fill="#e6edf3" font-size="10" text-anchor="middle">leads · location</text><text x="1290" y="802" fill="#e6edf3" font-size="10" text-anchor="middle">history · focus</text><text x="1290" y="850" fill="#8b949e" font-size="10" font-style="italic" text-anchor="middle">All persistent state lives here.</text><text x="1290" y="866" fill="#8b949e" font-size="10" font-style="italic" text-anchor="middle">Restart-safe except for</text><text x="1290" y="882" fill="#8b949e" font-size="10" font-style="italic" text-anchor="middle">_sessions (in-memory).</text></g><g><rect width="1100" height="100" x="40" y="100" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="10"/><text x="60" y="128" fill="#58a6ff" font-size="14" font-weight="700">1 · Browser</text><text x="60" y="148" fill="#8b949e" font-size="11">single-page UI · localStorage thread_id · dark-themed</text><rect width="200" height="32" x="60" y="158" fill="#0d1117" stroke="#30363d" rx="6"/><text x="160" y="178" fill="#e6edf3" font-size="11" text-anchor="middle">💬 Chat panel (left)</text><rect width="200" height="32" x="280" y="158" fill="#0d1117" stroke="#30363d" rx="6"/><text x="380" y="178" fill="#e6edf3" font-size="11" text-anchor="middle">📋 Lead board (right)</text><rect width="180" height="32" x="500" y="158" fill="#0d1117" stroke="#3fb950" rx="6"/><text x="590" y="178" fill="#3fb950" font-size="11" text-anchor="middle">✉️ Email modal</text><rect width="180" height="32" x="700" y="158" fill="#0d1117" stroke="#a78bfa" rx="6"/><text x="790" y="178" fill="#a78bfa" font-size="11" text-anchor="middle">🔁 Loops dashboard</text><rect width="220" height="32" x="900" y="158" fill="#0d1117" stroke="#facc15" rx="6"/><text x="1010" y="178" fill="#facc15" font-size="11" text-anchor="middle">📜 Past runs drawer (user/loop)</text></g><line x1="590" x2="590" y1="200" y2="225" stroke="#8b949e" stroke-width="1.5" marker-end="url(#downArrow)"/><g><rect width="1100" height="120" x="40" y="225" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="10"/><text x="60" y="253" fill="#58a6ff" font-size="14" font-weight="700">2 · FastAPI app · apps/ouroboros/main.py</text><text x="60" y="273" fill="#8b949e" font-size="11">REST endpoints + the single entry point _handle_full_turn(question, thread_id, source, loop_id)</text><rect width="170" height="48" x="60" y="285" fill="#0d1117" stroke="#30363d" rx="6"/><text x="145" y="305" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">POST /ask</text><text x="145" y="322" fill="#8b949e" font-size="10" text-anchor="middle">source=&apos;user&apos;</text><rect width="170" height="48" x="240" y="285" fill="#0d1117" stroke="#30363d" rx="6"/><text x="325" y="305" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">GET /runs · /session</text><text x="325" y="322" fill="#8b949e" font-size="10" text-anchor="middle">past-runs drawer feed</text><rect width="170" height="48" x="420" y="285" fill="#0d1117" stroke="#3fb950" rx="6"/><text x="505" y="305" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">/email/config · /test</text><text x="505" y="322" fill="#8b949e" font-size="10" text-anchor="middle">SMTP send + config</text><rect width="200" height="48" x="600" y="285" fill="#0d1117" stroke="#a78bfa" rx="6"/><text x="700" y="305" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">/cuga/loops/api/* · /cuga/loops/</text><text x="700" y="322" fill="#8b949e" font-size="10" text-anchor="middle">CRUD on loops + dashboard HTML</text><rect width="320" height="48" x="810" y="285" fill="#0d1117" stroke="#30363d" rx="6"/><text x="970" y="305" fill="#e6edf3" font-size="11" font-weight="700" text-anchor="middle">_handle_full_turn → _save_run + _maybe_send_email_for_run</text><text x="970" y="322" fill="#8b949e" font-size="10" text-anchor="middle">stamps source · fires email post-save (asyncio.create_task)</text></g><line x1="590" x2="590" y1="345" y2="370" stroke="#8b949e" stroke-width="1.5" marker-end="url(#downArrow)"/><g><rect width="1100" height="130" x="40" y="370" fill="#1a2332" stroke="#58a6ff" stroke-width="2" rx="10"/><text x="60" y="398" fill="#58a6ff" font-size="14" font-weight="700">3 · CugaSupervisor · enable_loops=True · cuga_lite_max_steps=100</text><text x="60" y="418" fill="#8b949e" font-size="11">model: RITSChatModel(&quot;gpt-oss-120b&quot;, max_tokens=16000) · LangGraph: prepare → call_model → execute → loop</text><rect width="450" height="56" x="60" y="432" fill="#0d1117" stroke="#30363d" rx="6"/><text x="80" y="450" fill="#e6edf3" font-size="11" font-weight="700">Execution sandbox (planner-callable):</text><text x="80" y="468" fill="#58a6ff" font-family="ui-monospace,monospace" font-size="10">delegate_to_&lt;each-of-7-specialists&gt;(task: str)</text><text x="80" y="482" fill="#a78bfa" font-family="ui-monospace,monospace" font-size="10">schedule_recurring · schedule_wakeup · cancel_loop · list_my_loops</text><rect width="280" height="56" x="520" y="432" fill="#0d1117" stroke="#facc15" rx="6"/><text x="540" y="450" fill="#facc15" font-size="11" font-weight="700">📋 Policies (3, attached once)</text><text x="540" y="468" fill="#e6edf3" font-size="10">intent_guard · ouroboros_abuse_guard</text><text x="540" y="482" fill="#e6edf3" font-size="10">tool_guide · output_formatter</text><rect width="320" height="56" x="810" y="432" fill="#0d1117" stroke="#a78bfa" rx="6"/><text x="830" y="450" fill="#a78bfa" font-size="11" font-weight="700">🔁 Custom loops callback registered</text><text x="830" y="468" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="10">_loop_invoke(prompt, thread_id)</text><text x="830" y="482" fill="#8b949e" font-size="10">→ routes back through _handle_full_turn (source=&apos;loop&apos;)</text></g><line x1="590" x2="590" y1="500" y2="525" stroke="#8b949e" stroke-width="1.5" marker-end="url(#downArrow)"/><g><rect width="1100" height="130" x="40" y="525" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="10"/><text x="60" y="553" fill="#58a6ff" font-size="14" font-weight="700">4 · Specialist CugaAgents (7) · isolated planner contexts</text><text x="60" y="572" fill="#8b949e" font-size="11">each agent = SKILL.md (special_instructions) + tools.py (TOOLS) + per-agent CugaLite plan/execute graph</text><g transform="translate(60,585)"><rect width="148" height="60" x="0" y="0" fill="#0d1117" stroke="#58a6ff" rx="6"/><text x="74" y="20" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">scout</text><text x="74" y="38" fill="#8b949e" font-size="9" text-anchor="middle">geocode + OSM</text><text x="74" y="52" fill="#8b949e" font-size="9" text-anchor="middle">find_local_businesses</text><rect width="148" height="60" x="153" y="0" fill="#0d1117" stroke="#a78bfa" rx="6"/><text x="227" y="20" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">voice_of_customer</text><text x="227" y="38" fill="#8b949e" font-size="9" text-anchor="middle">search_reviews</text><text x="227" y="52" fill="#8b949e" font-size="9" text-anchor="middle">(+ MCP web_search)</text><rect width="148" height="60" x="306" y="0" fill="#0d1117" stroke="#3fb950" rx="6"/><text x="380" y="20" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">site_auditor</text><text x="380" y="38" fill="#8b949e" font-size="9" text-anchor="middle">analyze_business_website</text><text x="380" y="52" fill="#8b949e" font-size="9" text-anchor="middle">17 capability+freshness</text><rect width="148" height="60" x="459" y="0" fill="#0d1117" stroke="#ec4899" rx="6"/><text x="533" y="20" fill="#ec4899" font-size="11" font-weight="700" text-anchor="middle">revenue_estimator</text><text x="533" y="38" fill="#8b949e" font-size="9" text-anchor="middle">search_size_signals</text><text x="533" y="52" fill="#8b949e" font-size="9" text-anchor="middle">estimate_arr_band</text><rect width="148" height="60" x="612" y="0" fill="#0d1117" stroke="#facc15" rx="6"/><text x="686" y="20" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">person_finder</text><text x="686" y="38" fill="#8b949e" font-size="9" text-anchor="middle">search_owner</text><text x="686" y="52" fill="#8b949e" font-size="9" text-anchor="middle">guess_email_from_name</text><rect width="148" height="60" x="765" y="0" fill="#0d1117" stroke="#14b8a6" rx="6"/><text x="839" y="20" fill="#14b8a6" font-size="11" font-weight="700" text-anchor="middle">stack_scanner</text><text x="839" y="38" fill="#8b949e" font-size="9" text-anchor="middle">scan_business_stack</text><text x="839" y="52" fill="#8b949e" font-size="9" text-anchor="middle">33 fingerprints</text><rect width="148" height="60" x="918" y="0" fill="#0d1117" stroke="#f97316" stroke-dasharray="3 2" rx="6"/><text x="992" y="20" fill="#f97316" font-size="11" font-weight="700" text-anchor="middle">pitch_email_writer</text><text x="992" y="38" fill="#8b949e" font-size="9" text-anchor="middle">TOOLS = [] (synthesis)</text><text x="992" y="52" fill="#8b949e" font-size="9" text-anchor="middle">JSON board + summary</text></g></g><line x1="590" x2="590" y1="655" y2="680" stroke="#8b949e" stroke-width="1.5" marker-end="url(#downArrow)"/><g><rect width="1100" height="100" x="40" y="680" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="10"/><text x="60" y="708" fill="#58a6ff" font-size="14" font-weight="700">5 · Tools · native @tool defs + MCP bridge</text><rect width="430" height="48" x="60" y="722" fill="#0d1117" stroke="#30363d" rx="6"/><text x="80" y="742" fill="#e6edf3" font-size="11" font-weight="700">Native tools (in skills/&lt;name&gt;/tools.py)</text><text x="80" y="758" fill="#8b949e" font-size="10">geocode · find_local_businesses · analyze_business_website · scan_business_stack · …</text><rect width="630" height="48" x="500" y="722" fill="#0d1117" stroke="#30363d" rx="6"/><text x="520" y="742" fill="#e6edf3" font-size="11" font-weight="700">MCP bridge: bind_web_search(coro) · pre-binds web_search into 3 specialists</text><text x="520" y="758" fill="#8b949e" font-size="10">apps/_mcp_bridge.py → mcp-web (Code Engine) — Tavily-backed; CUGA_TARGET=ce default</text></g><line x1="590" x2="590" y1="780" y2="805" stroke="#8b949e" stroke-width="1.5" marker-end="url(#downArrow)"/><g><rect width="1100" height="105" x="40" y="805" fill="#161b22" stroke="#8b949e" stroke-dasharray="4 3" stroke-width="1.5" rx="10"/><text x="60" y="833" fill="#8b949e" font-size="14" font-weight="700">6 · External services · network boundary</text><rect width="200" height="50" x="60" y="847" fill="#0d1117" stroke="#58a6ff" rx="6"/><text x="160" y="867" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">RITS gpt-oss-120b</text><text x="160" y="885" fill="#8b949e" font-size="10" text-anchor="middle">via LiteLLM proxy :4000</text><rect width="200" height="50" x="270" y="847" fill="#0d1117" stroke="#58a6ff" rx="6"/><text x="370" y="867" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">OpenStreetMap</text><text x="370" y="885" fill="#8b949e" font-size="10" text-anchor="middle">Nominatim + Overpass</text><rect width="200" height="50" x="480" y="847" fill="#0d1117" stroke="#a78bfa" rx="6"/><text x="580" y="867" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">Tavily search</text><text x="580" y="885" fill="#8b949e" font-size="10" text-anchor="middle">via mcp-web (Code Engine)</text><rect width="200" height="50" x="690" y="847" fill="#0d1117" stroke="#3fb950" rx="6"/><text x="790" y="867" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">SMTP (gmail by default)</text><text x="790" y="885" fill="#8b949e" font-size="10" text-anchor="middle">stdlib smtplib + STARTTLS</text><rect width="220" height="50" x="900" y="847" fill="#0d1117" stroke="#facc15" rx="6"/><text x="1010" y="867" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">target business websites</text><text x="1010" y="885" fill="#8b949e" font-size="10" text-anchor="middle">httpx GET (site_auditor / stack_scanner)</text></g><g><text x="0" y="0" fill="#8b949e" font-size="12" font-weight="700" transform="translate(40,950)">DESIGN POINTS</text><text x="0" y="22" fill="#e6edf3" font-size="11" transform="translate(40,950)">• <tspan fill="#58a6ff" font-weight="700">Single entry</tspan>: both POST /ask and APScheduler fires call _handle_full_turn — same code path, different `source`.</text><text x="0" y="42" fill="#e6edf3" font-size="11" transform="translate(40,950)">• <tspan fill="#58a6ff" font-weight="700">Supervisor planner</tspan> only sees delegate_to_&lt;X&gt; + the loop tools; specialists&apos; native tools are scoped to specialists, not the planner.</text><text x="0" y="62" fill="#e6edf3" font-size="11" transform="translate(40,950)">• <tspan fill="#a78bfa" font-weight="700">CUGA Loops</tspan> are first-class on the supervisor — schedule_* are injected into its execution sandbox via enable_loops=True.</text><text x="0" y="82" fill="#e6edf3" font-size="11" transform="translate(40,950)">• <tspan fill="#facc15" font-weight="700">Storage is the persistence boundary</tspan>: kill ouroboros and restart — runs/, .email_store.json, and cuga_loops survive; _sessions doesn&apos;t.</text></g><text x="720" y="1075" fill="#6b7280" font-size="10" text-anchor="middle">apps/ouroboros/stack.svg · referenced from ARCHITECTURE.md</text></svg>